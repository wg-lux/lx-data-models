schema_version: "1.0"
id: production_application_foundations
name: Production Application Foundations
description: >-
  Define the reusable lx-dtypes contracts and delivery guarantees that let host
  applications provide predictable, resilient, secure, observable, accessible,
  and maintainable production workflows. Application-specific UI, networking,
  persistence, telemetry backends, and release infrastructure remain owned by
  their host applications.
owners:
  - lx-dtypes maintainers
production_critical: true
source_documents:
  - path: README.md
    disposition: reference
    note: Defines lx-dtypes as reusable typed contracts for host integrations.
  - path: docs/guides/package_boundary.md
    disposition: normative
    note: Defines the package boundary between reusable models and host application behavior.
  - path: /home/admin/dev/lx-annotate/frontend/README.md
    disposition: reference
    note: >-
