  - id: maintainable_contract_documentation
    category: documentation
    title: Boundary ownership and operating expectations are documented
    acceptance:
      - Documentation identifies the package as the source of truth for reusable data contracts and identifies host-owned operational responsibilities.
      - Public contract changes include explicit compatibility, migration, and validation guidance.
      - This feature specification remains the canonical production-foundations readiness definition for lx-dtypes.
    required: true
    verification:
      kind: manual
      instructions: Review README, package-boundary guidance, public API documentation, and this feature specification for consistent ownership and compatibility statements.
      timeout_seconds: 600
  - id: hostile_clinical_input_correctness
    category: security
    title: Untrusted clinical inputs cannot silently change report meaning
    required: true
    acceptance:
      - Malformed, ambiguous, nonfinite, or unsupported clinical values fail explicitly instead of becoming successful findings.
      - Duplicate identifiers, inconsistent graph relationships, stale hashes, and cross-patient references fail closed.
      - Exported spreadsheet text is literal and failed or competing exports preserve existing workbooks.
      - Every supported external profile has reviewed adversarial fixtures and explicit resource limits.
    verification:
      kind: command
      command: [uv, run, pytest, tests/test_fhir_clinical.py, tests/unit/lx_dtypes/models/contracts/test_sap_ish_import.py, tests/unit/lx_dtypes/test_excel_export.py, tests/unit/lx_dtypes/django/api/test_knowledge_base_graph_api.py, tests/unit/lx_dtypes/models/knowledge_base/test_fhir_export.py, -q]
      timeout_seconds: 600
    assessment:
      status: in_progress
      assessed_by: codex-lxd-reliability-20260909-01
      assessed_at: "2026-09-09T10:38:53Z"
      note: >-
        Provisional hostile-input assessment assumes attackers can supply import
        content, graph payloads, and report text through endoreg-db, but cannot
        execute arbitrary Python inside the trusted host process. Authentication,
        center isolation, upload quotas, and process limits remain host-owned and
        have not been verified in a deployed clinical environment. The fixes below
        address demonstrated integrity and availability failures; they do not
        constitute a completed independent security review or clinical approval.
        Profile-specific limits, complete parser coverage, and host acceptance
        remain outstanding. The user has not supplied profile or scale targets.
      evidence:
        - kind: review
          reference: lx_dtypes/models/knowledge_base/report_template/ValidatorRuntime.py:442
          note: >-
            CLIN-001, high integrity impact: malformed FHIR component values could
            become True. The bridge now validates typed components, preserves false
            and literal strings, and rejects malformed choices. Unitless numbers
            export as Quantity. Export status defaults to preliminary; explicit
            status=final is required for final fragments. These are intentional
            compatibility changes; the host still supplies patient/resource context.
        - kind: review
          reference: lx_dtypes/models/contracts/fhir_clinical.py:202
          note: >-
            CLIN-002, medium availability and high integrity impact: bundle link
            traversal previously rebuilt the full index for each reference and
            missed duplicate patient-only entries. Each operation now builds one
            index, rejects duplicate targets and cross-patient links, and avoids
            including reference contents in link-error messages. Strict numeric
            values, FHIR resource ID syntax, and unsupported modifiers are checked.
        - kind: review
          reference: lx_dtypes/models/contracts/knowledge_base_graph.py:584
          note: >-
            CLIN-003, high integrity impact: envelopes previously accepted edges
            inconsistent with concepts and content inconsistent with snapshot IDs.
            Validation now checks both, as well as published template membership.
            Hashes provide consistency, not authenticity; trusted source approval
            remains necessary and must not be inferred from a valid hash.
        - kind: review
          reference: lx_dtypes/stats/excel.py:11
          note: >-
            CLIN-004, high integrity impact: spreadsheet text could become formulas
            and failed overwrites could destroy prior exports. XLSX output now uses
            literal string cells, preserves large integer identifiers as decimal
            text, rejects oversized text and colliding sheet names, and publishes
            completed files atomically with no-clobber behavior when requested.
            Long sheet names now use a stable eight-hex suffix after a 22-character
            prefix; this fixes actual classification-choice/descriptor sheet
            collisions in the existing full dataset export. Consumers referencing
            old truncated worksheet names must use the new deterministic names.
            Aware timestamps become UTC naive values because Excel lacks timezone
            storage. Source dataframes are not modified. CSV output is unchanged.
        - kind: review
          reference: lx_dtypes/models/knowledge_base/fhir.py:837
          note: >-
            CLIN-005, high integrity impact: different names could normalize to the
            same FHIR code. Export now rejects collisions instead of conflating
            concepts. Import rejects malformed or duplicate concepts and traverses
            in-memory hierarchies iteratively with repeated-object detection.
            Heuristic terminology domain inference still requires clinical review.
        - kind: review
          reference: lx_dtypes/models/contracts/sap_ish_import.py:18
          note: >-
            CLIN-006, medium integrity impact: nested SAP envelope dumps shared
            mutable data and admitted nonfinite values. Dumps now copy recursively
            and validation rejects nonfinite values. This remains a generic typed
            transport envelope, not validation of SAP field meanings or clinical codes.
  - id: graph_resolution_scale
    category: operations
    title: Graph resolution has measured scaling and explicit host cache ownership
    required: true
    acceptance:
      - Repeated reporting queries reuse a validated isolated index without scanning unrelated graph records.
      - Reference traversal avoids rebuilding the complete index for every edge.
