invariants:
  - External data is validated strictly at typed boundaries; malformed, ambiguous, or unsupported payloads do not silently become valid state.
  - Failure information is structured, actionable, and safe to expose; it does not contain secrets, patient data, checkout paths, or internal implementation details.
  - Contracts are deterministic: equivalent validated inputs produce equivalent serialized boundary payloads, and side-effect ownership remains explicit.
  - Accessibility, UI feedback, network retry behavior, persistence, telemetry transport, and CI/CD execution belong to consuming applications, which may rely on these contracts without importing application logic into lx-dtypes.
definition_of_done:
  - id: resilient_error_contracts
    category: requirements
    title: Typed boundaries communicate recoverable and terminal failures
    acceptance:
      - Public validators reject invalid inputs with field-specific, actionable errors rather than uncaught implementation exceptions.
      - Typed result and error contracts distinguish validation, conflict, unavailable-dependency, and unsupported-version failures where the package owns those boundaries.
      - Failure payloads preserve correlation or request identifiers when supplied by a host without generating or persisting host operational state.
    required: true
    verification:
      kind: manual
      instructions: Review public boundary models and focused failure-path tests for actionable typed failures and absence of host retry or persistence logic.
      timeout_seconds: 600
  - id: security_and_privacy_boundaries
    category: security
    title: Shared contracts enforce secure and privacy-preserving data boundaries
    acceptance:
      - Models use explicit types and constraints for externally supplied identifiers, versions, paths, URLs, and content metadata.
      - Serialization and validation errors do not expose credentials, patient data, absolute local paths, or raw untrusted payloads by default.
      - Access-control decisions, encryption-key management, and credential handling are not implied by model defaults and remain explicit host responsibilities.
    required: true
    verification:
      kind: manual
      instructions: Review public models, serializers, and invalid-input tests for strict validation and confidential-data-safe error behavior.
      timeout_seconds: 600
  - id: observability_contracts
    category: operations
    title: Contracts retain safe context for host observability
    acceptance:
      - Relevant result, error, and provenance models include stable identifiers, schema or contract versions, and machine-readable failure classification.
      - Models can be serialized deterministically for host logging, tracing, and metrics without requiring a telemetry vendor dependency.
      - No model implicitly emits telemetry, writes logs, or transmits data outside the host-controlled boundary.
    required: true
    verification:
      kind: manual
      instructions: Review serialized public result and error contracts for stable diagnostic fields and confirm package code has no telemetry transport side effect.
      timeout_seconds: 600
  - id: accessibility_and_feedback_contracts
    category: functionality
    title: Host interfaces receive structured feedback suitable for inclusive UX
    acceptance:
      - Validation failures identify affected fields and constraints in a presentation-independent structure.
      - Public enums and status values are stable, documented, and machine-readable so hosts can localize and present them accessibly.
      - The package does not prescribe visual design, focus management, keyboard behavior, or screen-reader implementation.
    required: true
    verification:
      kind: manual
      instructions: Review validation error shapes and public status enums for stable presentation-independent information.
      timeout_seconds: 600
  - id: deterministic_state_contracts
    category: functionality
    title: Shared data contracts prevent ambiguous state transitions
    acceptance:
      - Models express version, identity, lifecycle, and concurrency-relevant fields explicitly where the domain requires them.
      - Contradictory lifecycle combinations and unsupported versions fail validation.
      - Serialization is deterministic and does not mutate caller-owned input or hidden global state.
      - Validation and serialization introduce no implicit network, filesystem, or telemetry I/O, leaving host applications free to apply caching, optimistic updates, and responsive loading behavior.
    required: true
    verification:
      kind: command
      command: [uv, run, pytest, tests, -q]
      timeout_seconds: 1200
  - id: boundary_regression_coverage
    category: testing
    title: Production boundary behavior has automated regression coverage
    acceptance:
      - Focused tests cover valid payloads, invalid payloads, version mismatch, serialization, and representative failure paths for every public boundary changed under this feature.
      - Tests are deterministic and contain no patient data, secrets, network dependency, or checkout-specific path assertions.
      - Static type checking covers modified public contracts.
    required: true
    verification:
      kind: command
      commands:
        - command: [uv, run, pyright]
        - command: [uv, run, pytest, tests, -q]
      timeout_seconds: 1800
  - id: compatible_delivery_contract
    category: operations
    title: Package delivery preserves predictable integration behavior
    acceptance:
      - Public imports and serialized contract shapes are versioned and remain backward compatible unless a documented breaking change is released.
      - Packaged resources are immutable, installation-path-independent, and validate before use where applicable.
      - The package release pipeline gates publication on its required static analysis, automated tests, and documentation checks.
      - Host-side caching, retries, optimistic updates, deployment rollout, and rollback are documented as host concerns rather than hidden package behavior.
    required: true
    verification:
      kind: manual
      instructions: Review package exports, versioning guidance, resource loading behavior, and host-integration documentation.
      timeout_seconds: 600
    assessment:
      status: in_progress
      assessed_by: codex-lxd-reliability-20260909-01
      assessed_at: "2026-09-09T10:38:53Z"
      note: >-
        Publication now requires reusable CI and documentation jobs on the same
        checkout before building distribution artifacts. CI explicitly installs
        and runs Pyright and executes the full pytest suite with coverage and
        JUnit output; the configured 70 percent coverage threshold is enforced.
        Documentation requires HTML and link checks. Both release and manual
        publication follow the dependency chain through these gates. Codecov
        uploads remain limited to push and pull-request runs so release gates
        do not need the caller's Codecov secret. Existing public imports remain;
        KnowledgeBaseGraphResolver is additive. Compatibility changes include
        stricter invalid-input rejection, preliminary FHIR export status, numeric
        Quantity output, stable long-sheet names, and canonical graph ordering.
        They are documented in the guides and hostile-input assessment below.
