# ESGE 2024 colorectal polypectomy/EMR guideline size-category scheme -- see
# config.yaml. Ferlitsch et al., Endoscopy 2024;56(7):516-545,
# doi:10.1055/a-2304-3219.
- {model: classification_type, name: demo_size_category_type, name_en: Polyp size category type, name_de: Polyp size category type, description: "Classification type shared by all polyp-size-category classification versions in this demo."}
- {model: classification, name: demo_polyp_size_category, name_en: "Polyp size category (ESGE 2024 colorectal polypectomy/EMR guideline)", name_de: "Polyp size category (ESGE 2024 colorectal polypectomy/EMR guideline)", classification_types: [demo_size_category_type], classification_choices: [demo_size_diminutive, demo_size_small, demo_size_large_nonpedunculated, demo_size_lnpcp], description: "Ferlitsch et al., Endoscopy 2024;56(7):516-545, doi:10.1055/a-2304-3219. Four size-based management categories, each with its own resection-technique recommendation."}
- {model: classification_choice, name: demo_size_diminutive, name_en: "Diminutive (<=5 mm)", name_de: "Diminutive (<=5 mm)", description: "Boundary: raw size_oval_mm <= 5. Recommendation 1: cold snare polypectomy (strong recommendation, high quality of evidence)."}
- {model: classification_choice, name: demo_size_small, name_en: "Small (6-9 mm)", name_de: "Small (6-9 mm)", description: "Boundary: 6 <= raw size_oval_mm <= 9. Recommendation 3: cold snare polypectomy (strong recommendation, high quality of evidence)."}
- {model: classification_choice, name: demo_size_large_nonpedunculated, name_en: "Large nonpedunculated (10-19 mm)", name_de: "Large nonpedunculated (10-19 mm)", description: "Boundary: 10 <= raw size_oval_mm <= 19. Recommendation 4: hot snare polypectomy (strong recommendation, high quality of evidence)."}
- {model: classification_choice, name: demo_size_lnpcp, name_en: "Large nonpedunculated colorectal polyp / LNPCP (>=20 mm)", name_de: "Large nonpedunculated colorectal polyp / LNPCP (>=20 mm)", description: "Boundary: raw size_oval_mm >= 20. Recommendation 5: conventional (diathermy-based) endoscopic mucosal resection (strong recommendation, high quality of evidence)."}
