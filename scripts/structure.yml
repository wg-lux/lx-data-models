version: 1
tier: tool
path: scripts
parent: ../structure.yml
summary: Repository-only authoring, audit, import, and context validation commands. Installed application
  CLIs live separately in lx_dtypes/scripts.
responsibilities:
- Validate context metadata without importing application code
- Support explicit authoring and conversion tasks
boundaries:
- Do not import repository scripts from consuming applications
- Generated authoring output belongs in temporary storage
entrypoints:
- name: Model boundary validator
  file: lint_model_boundaries.py
  purpose: Reject bypasses of shared model profiles and unreviewed contract dependencies or extra-field exceptions
- name: Standardized demo export
  file: usage_example.py
  purpose: Regenerate complete CSV tables from the synthetic STAR upper-GI ledger
- name: Context validator
  file: lint_structure.py
  purpose: Check strict schemas, references, and graph consistency
- name: Terminology catalog maintenance
  file: kb_catalog.py
  purpose: Diagnose catalog integrity, retain releases with new-version and refresh unreleased digests
- name: KB lint wrapper
  file: lint_kb_yaml.py
  purpose: Delegate to the canonical package linter
- name: MST import
  file: import_mst_excel.py
  purpose: Explicit source conversion tooling
- name: Manuscript revision
  file: revise_lxdm_manuscript.py
  purpose: Apply the reviewed replacements in manuscript/reconciliation.yml to a copy of the LXDM manuscript
dependencies:
  internal:
  - ../lx_dtypes
  external:
  - Git
  - Pydantic v2
  - PyYAML
submodules: []
contracts:
- name: Model boundary inventory
  doc: ../docs/model-boundaries.yml
- name: Terminology releases
  doc: ../docs/guides/terminology-releases.md
- name: KB linting
  doc: ../docs/guides/kb-yaml-linting.md
- name: Agent context
  doc: ../docs/agent_context.md
tests:
  directory: ../tests
  command: uv run pytest tests/test_structure.py -q
