decisions: [Excel is the source for attributes and matrices; legacy labels and identifiers are retained as aliases., 'Luminal
    Distribution values on rows 46:48 apply through row 53 (v continuation markers); rows 60:62 apply through row 65. Row
    54 is not assigned this attribute.', Finding/organ matrices restrict locations where supplied. Terms absent from a matrix
    receive no inferred organ restrictions., 'EUS lesion-specific shape and echo lists take precedence over the general value
    lists, including linear, which occurs only in the specific list.', Papillary Output None exists only in the organ matrix;
    Mucin exists only in the attribute table. Preserve both with their source references., The severity table leaves exactly
    three hospitalization nights unspecified; preserve its literal outcome categories without inferring thresholds., Procedures
    are represented by companion findings linked to stable intervention identifiers because interventions cannot own classifications.,
  Source-only English labels are retained for new concepts; German translations are not fabricated., Anatomy modifiers are
    explicit descriptor inputs. Biliary modifier sub-blocks apply only to their listed duct sites; station number applies
    only to the EUS lymph-node station., 'Numeric count placeholders use the existing count unit; EUS microcyst size and wall
    thickness use millimeters, consistent with the sheet size header.', T-stage and N-stage remain explicit text inputs because
    the workbook does not enumerate staging values., 'The workbook organ matrices provide allowed locations; cross-field dependencies
    such as papillary choices conditional on major/minor papilla remain source constraints, not automatic validators.']
