repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: ["--fix", "lx_dtypes", "tests"]
        pass_filenames: false
      - id: ruff-format
        args: ["lx_dtypes", "tests"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: kb-yaml-lint
        name: knowledge base yaml lint
        entry: .devenv/state/venv/bin/python lx_dtypes/scripts/lint_kb_yaml.py
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright type check
        entry: pyright lx_dtypes
        language: system
        pass_filenames: false
      - id: pytest-suite
        name: pytest suite
        entry: .devenv/state/venv/bin/pytest
        language: system
        pass_filenames: false

