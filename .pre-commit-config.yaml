repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: ["--fix", "lx_dtypes", "tests"]
        pass_filenames: false
      - id: ruff-format
        args: ["lx_dtypes", "tests"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: kb-yaml-lint
        name: knowledge base yaml lint
        entry: .devenv/state/venv/bin/python lx_dtypes/scripts/lint_kb_yaml.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy type check
        entry: .devenv/state/venv/bin/mypy --config-file pyproject.toml
        language: system
        types: [python]
      - id: pyright
        name: pyright type check
        entry: pyright lx_dtypes
        language: system
        pass_filenames: false
      - id: pytest-suite
        name: pytest suite
        entry: .devenv/state/venv/bin/pytest
        language: system
        pass_filenames: false
      - id: findings-validator-operator-guard
        name: findings validator operator guard
        entry: .devenv/state/venv/bin/pytest -q lx_dtypes/models/interface/tests/test_findings_validator_operator_guard.py
        language: system
        pass_filenames: false
