version: 1
owner: lx_dtypes maintainers
canonical_topic: Shared model policies, evaluation direction and explicit architectural exceptions
scope: Every package-owned Pydantic declaration under lx_dtypes; framework adapters are listed separately.
rules:
  source_of_truth: lx_dtypes/models/model.py
  default: DtypesModel rejects unknown fields. StrictContractModel also rejects coercion; FrozenContractModel
    also rejects assignment.
  root_values: DtypesRootModel validates its declared root type; mapping keys are data, not extra object
    fields.
  local_invariants: Model field and cross-field invariants stay on the owning models. Existing per-model
    strictness, mutability and serialization settings are retained.
  evaluation: lx_dtypes.evaluation parses Python or JSON through the owning models, delegates semantic
    rules and returns localized value-free findings. It performs no persistence.
  dependency_direction: Evaluation depends on contracts. Contracts may depend on runtime engines only
    through the exact reviewed exceptions below.
  registries: Pydantic registry definitions have one owner; Django aggregation imports those definitions
    and supplies ORM adapters only on request.
  test_ownership: All executable tests belong under tests/, including isolated API harnesses.
verification: uv run python scripts/lint_model_boundaries.py
extra_field_exceptions:
- path: lx_dtypes/django/api/report_template_builder.py
  policy: ignore
  models:
  - ReportTemplateBuilderSection
  reason: Retained explicit projection/extension behavior of the existing wire contract. New canonical
    records use closed model profiles.
- path: lx_dtypes/knowledge_base_registry.py
  policy: allow
  models:
  - RegistryEntry
