structural_outliers:
- path: lx_dtypes/models/interface/examples
  kind: installed_examples
  rule: New authoring examples belong in docs/examples or repository scripts. Existing module paths remain
    for compatibility.
- path: lx_dtypes/models/knowledge_base/report_template
  kind: compatibility_modules
  rule: ValidatorRuntime, RuntimeIssues and validator re-exports delegate to knowledge_base/validators.
    Add new rules only to the owning validator engine.
- path: lx_dtypes/models/base/app_base_model/django
  kind: domain_colocated_orm_adapters
  rule: Historical backend adapters remain beside domain types; production ORM aggregation belongs to
    lx_dtypes/django and must not load through Pydantic imports.
- path: lx_dtypes/models/contracts/video_frame_export.py
  kind: legacy_file_loader
  rule: load_video_frame_annotation_export_config performs explicit YAML file I/O beside its transport
    model. New transport loaders belong under models/interface; model_validate itself remains free of
    file I/O.
- path: lx_dtypes/models/contracts/export_annotated.py
  kind: legacy_file_loader
  rule: from_api_payload and _load_yaml_payload optionally read a caller-selected configuration file.
    Retained for existing callers; new file import APIs belong under models/interface.
- path: lx_dtypes/models/contracts/ai_prediction.py
  kind: in_process_callable_contract
  rule: AiPredictionConfigPayload.activation is a Python callable. This model is an in-process value contract
    and must not be presented as a universally JSON-serializable wire DTO.
