contract_runtime_dependencies:
- path: lx_dtypes/models/contracts/aidataset_export.py
  dependencies:
  - lx_dtypes.models.ledger.p_video.Pydantic
  reason: Legacy dataset envelopes embed ledger video records. Preserve the existing wire shape; standalone
    media contracts are preferred for new envelopes.
- path: lx_dtypes/models/contracts/electrical_video_alignment.py
  dependencies:
  - lx_dtypes.evaluation.electrical
  reason: Public legacy functions delegate lazily to evaluation.electrical; the algorithm has one implementation
    and model imports remain independent.
- path: lx_dtypes/models/contracts/examination_revision.py
  dependencies:
  - lx_dtypes.models.ledger.medical.Write
  reason: Revision payloads reuse existing medical write DTOs. These shapes are still owned under ledger/medical/Write.py.
- path: lx_dtypes/models/contracts/package_snapshot.py
  dependencies:
  - lx_dtypes.models.interface.KnowledgeBase
  - lx_dtypes.models.interface.KnowledgeBaseConfig
  - lx_dtypes.models.knowledge_base.pydantic_main
  - lx_dtypes.models.knowledge_base.report_template.TemplateReadiness
  reason: Snapshot digest, graph closure and published-template checks restore runtime KBs. Moving these
    checks requires a versioned persistence-contract change.
- path: lx_dtypes/models/contracts/study_exchange.py
  dependencies:
  - lx_dtypes.stats.study
  - lx_dtypes.validation
  reason: The current wire contract recomputes stored assessments and study rules during validation. Keep
    these fail-closed checks until a versioned exchange boundary separates them.
- path: lx_dtypes/models/contracts/table_import.py
  dependencies:
  - lx_dtypes.models.knowledge_base.classification_choice_descriptor.ClassificationChoiceDescriptor
  - lx_dtypes.models.knowledge_base.pydantic_main
  reason: Mappings derive model names and descriptor constraints from the canonical KB registry and definitions;
    no second terminology schema is maintained.
