<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" fill="none">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
</filter>
<marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<polygon points="0 0, 10 4, 0 8" fill="#475569"/>
</marker>
</defs>
<rect width="1500" height="900" fill="white"/>
<text x="44" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Report-Template: Kompilierung und Export</text>
<text x="44" y="88" text-anchor="start" font-size="14" fill="#475569" font-family="Inter, Arial, sans-serif">Vom YAML-Modul zur typisierten KnowledgeBase, validierten Struktur und JSON-Ausgabe für Frontend und API.</text>
<rect x="50" y="145" width="260" height="175" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="175" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">1. YAML-Module</text>
<text x="70" y="207" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Report-Templates, Sektionen,</text>
<text x="70" y="225" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Findings und Validatoren werden</text>
<text x="70" y="243" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">als versionierte YAML-Daten</text>
<text x="70" y="261" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">gepflegt.</text>
<rect x="380" y="145" width="260" height="175" rx="16" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
<text x="400" y="175" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">2. DataLoader</text>
<text x="400" y="207" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Findet Modulkonfigurationen und</text>
<text x="400" y="225" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">baut pro Modul eine KnowledgeBase</text>
<text x="400" y="243" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">im Speicher auf.</text>
<rect x="710" y="145" width="260" height="175" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
<text x="730" y="175" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">3. Typisierte Modelle</text>
<text x="730" y="207" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Der Parser wählt über model=...</text>
<text x="730" y="225" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">das Pydantic-Modell und validiert</text>
<text x="730" y="243" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">jeden YAML-Eintrag.</text>
<rect x="1040" y="145" width="330" height="175" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
<text x="1060" y="175" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">4. KnowledgeBase</text>
<text x="1060" y="207" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Speichert Templates, Sektionen, Report-</text>
<text x="1060" y="225" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Findings und Validatoren in benannten</text>
<text x="1060" y="243" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Registern.</text>
<rect x="210" y="510" width="350" height="180" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
<text x="230" y="540" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">5. Strukturprüfung</text>
<text x="230" y="572" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Prüft Referenzen, Graph-Struktur,</text>
<text x="230" y="590" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Publikationsreife und Preview-Fähigkeit.</text>
<rect x="650" y="510" width="300" height="180" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="670" y="540" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">6. Compiler</text>
<text x="670" y="572" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Löst Sektionen, Finding-Anforderungen</text>
<text x="670" y="590" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">und Validatoren zu einem JSON-Baum auf.</text>
<rect x="1040" y="510" width="350" height="180" rx="16" fill="#ffe4e6" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
<text x="1060" y="540" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">7. Export</text>
<text x="1060" y="572" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Preview exportiert Entwürfe. Produktion</text>
<text x="1060" y="590" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">exportiert nur veröffentlichte und</text>
<text x="1060" y="608" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">freigegebene Templates.</text>
<line x1="310" y1="232" x2="380" y2="232" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="345.0" y="222.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">finden</text>
<line x1="640" y1="232" x2="710" y2="232" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="675.0" y="222.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">parsen</text>
<line x1="970" y1="232" x2="1040" y2="232" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="1005.0" y="222.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">registrieren</text>
<line x1="1205" y1="320" x2="385" y2="510" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="795.0" y="399.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">validieren</text>
<line x1="560" y1="600" x2="650" y2="600" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="605.0" y="590.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">kompilieren</text>
<line x1="950" y1="600" x2="1040" y2="600" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="995.0" y="590.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">ausliefern</text>
<text x="750.0" y="820" text-anchor="middle" font-size="13" fill="#475569" font-family="Inter, Arial, sans-serif">Wichtig: Struktur- und Graph-Prüfung bewerten Template-Topologie. Die Prüfung eines echten Berichts gegen PExamination läuft separat.</text>
</svg>
