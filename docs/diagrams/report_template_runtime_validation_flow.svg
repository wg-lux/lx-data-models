<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" fill="none">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
</filter>
<marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<polygon points="0 0, 10 4, 0 8" fill="#475569"/>
</marker>
</defs>
<rect width="1500" height="900" fill="white"/>
<text x="44" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Report-Template: Runtime-Validierung</text>
<text x="44" y="88" text-anchor="start" font-size="14" fill="#475569" font-family="Inter, Arial, sans-serif">Produktiver Prüfpfad für einen echten Bericht: KnowledgeBase auflösen, Zulässigkeit prüfen, Validatoren ausführen.</text>
<rect x="50" y="150" width="280" height="170" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="70" y="180" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Client-Payload</text>
<text x="70" y="212" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Frontend oder Host-Django sendet</text>
<text x="70" y="230" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">einen Bericht oder fordert</text>
<text x="70" y="248" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Validierung aus dem Ledger an.</text>
<rect x="390" y="150" width="280" height="170" rx="16" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
<text x="410" y="180" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">PExamination</text>
<text x="410" y="212" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Der Bericht wird in eine typisierte</text>
<text x="410" y="230" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">PExamination-Struktur überführt.</text>
<rect x="730" y="150" width="300" height="170" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
<text x="750" y="180" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">KB-Auflösung</text>
<text x="750" y="212" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Modul und optionale Version werden</text>
<text x="750" y="230" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">bestimmt; die passende KnowledgeBase</text>
<text x="750" y="248" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">wird geladen.</text>
<rect x="1090" y="150" width="320" height="170" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
<text x="1110" y="180" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Produktions-Template</text>
<text x="1110" y="212" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">export_report_template stellt sicher, dass</text>
<text x="1110" y="230" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">das Template veröffentlicht und</text>
<text x="1110" y="248" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">freigegeben ist.</text>
<rect x="210" y="515" width="360" height="180" rx="16" fill="#ffe4e6" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
<text x="230" y="545" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Semantische Zulässigkeit</text>
<text x="230" y="577" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Prüft, ob Untersuchung, Findings und</text>
<text x="230" y="595" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Anforderungen zum gewählten Template passen.</text>
<rect x="650" y="515" width="320" height="180" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
<text x="670" y="545" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Validator-Ausführung</text>
<text x="670" y="577" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Findings-, Klassifikations-,</text>
<text x="670" y="595" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Interventions-, Unit- und Examination-</text>
<text x="670" y="613" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Validatoren laufen gegen Runtime-Daten.</text>
<rect x="1050" y="515" width="360" height="180" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="1070" y="545" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a" font-family="Inter, Arial, sans-serif">Ergebnis oder Fehler</text>
<text x="1070" y="577" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Erfolg liefert Validator-Ergebnisse.</text>
<text x="1070" y="595" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">Semantikfehler werden 422, fehlende Templates</text>
<text x="1070" y="613" text-anchor="start" font-size="13" fill="#0f172a" font-family="Inter, Arial, sans-serif">404.</text>
<line x1="330" y1="235" x2="390" y2="235" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="360.0" y="225.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">normalisieren</text>
<line x1="670" y1="235" x2="730" y2="235" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="700.0" y="225.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">Version wählen</text>
<line x1="1030" y1="235" x2="1090" y2="235" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="1060.0" y="225.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">Template laden</text>
<line x1="1250" y1="320" x2="420" y2="515" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="835.0" y="401.5" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">Runtime-Prüfung</text>
<line x1="570" y1="605" x2="650" y2="605" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="610.0" y="595.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">ausführen</text>
<line x1="970" y1="605" x2="1050" y2="605" stroke="#475569" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<text x="1010.0" y="595.0" text-anchor="middle" font-size="12" fill="#475569" font-family="Inter, Arial, sans-serif">antworten</text>
<text x="750.0" y="820" text-anchor="middle" font-size="13" fill="#475569" font-family="Inter, Arial, sans-serif">Dieser Pfad nutzt eine aufgelöste produktive KnowledgeBase. Er arbeitet nicht direkt auf rohen YAML-Dateien.</text>
</svg>
