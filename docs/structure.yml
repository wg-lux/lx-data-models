version: 1
tier: domain
path: docs
parent: ../structure.yml
summary: Canonical developer guides, API reference sources, and executable documentation examples. Maintained
  by lx_dtypes maintainers under the shared documentation governance policy.
responsibilities:
- Document public contracts and authoring workflows in English
- Maintain Sphinx sources and deterministic examples
boundaries:
- Generated Sphinx output stays in ignored _build
- Cross-repository readiness tracking belongs to endoreg-db
entrypoints:
- name: Documentation index
  file: index.md
  purpose: Top-down documentation entry point
- name: Sphinx config
  file: conf.py
  purpose: Documentation build configuration
- name: OpenAPI reference extension
  file: _ext/openapi_reference.py
  purpose: Render the HTTP API reference and openapi.json from the Ninja schema at build time
- name: Agent context
  file: agent_context.md
  purpose: Canonical context manifest protocol
dependencies:
  internal:
  - ../lx_dtypes
  external:
  - Sphinx
  - MyST
submodules: []
contracts:
- name: Shared model and evaluation boundary
  doc: guides/cross-layer-validation.md
- name: Structural model outliers
  doc: model-boundaries.yml
- name: Dates, times and offsets
  doc: guides/dates-and-times.md
- name: Configured study inference
  doc: guides/study-inference.md
- name: Shared study protocol metadata
  doc: guides/study-metadata.md
- name: ColoReg resection study specification
  doc: guides/coloreg-resection-study.md
- name: Data-model concept map
  doc: guides/data-model-concept-map.md
- name: HTTP API reference
  doc: api/http.rst
- name: Standardized CSV exports
  doc: guides/standardized-csv-export.md
- name: Record import and export formats
  doc: guides/record-data-formats.md
- name: Package authoring
  doc: guides/dtypes-package-structure.md
- name: Package kinds and channels
  doc: guides/package-kinds.md
- name: ePA FHIR compatibility
  doc: guides/epa-fhir-compatibility.md
- name: Report template authoring for study staff
  doc: guides/report-template-authoring.md
- name: Electrosurgical video alignment
  doc: guides/electrosurgical-video-alignment.md
tests:
  directory: ../tests
  command: uv run make -C docs html

files:
- examples/study_metadata
- examples/dtypes_packages/time_references
- examples/dtypes_packages/electrical_curves
- examples/dtypes_packages/colonoscopy_medication_electrosurgery
- medication_plan_specification_summary.md
- german-medication-plan
