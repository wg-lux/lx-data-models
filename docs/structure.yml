version: 1
tier: domain
path: docs
parent: ../structure.yml
summary: Canonical developer guides, API reference sources, and executable documentation examples. Maintained
  by lx_dtypes maintainers under the shared documentation governance policy.
responsibilities:
- Document public contracts and authoring workflows in English
- Maintain Sphinx sources and deterministic examples
boundaries:
- Generated Sphinx output stays in ignored _build
- Cross-repository readiness tracking belongs to endoreg-db
entrypoints:
- name: Documentation index
  file: index.md
  purpose: Top-down documentation entry point
- name: Sphinx config
  file: conf.py
  purpose: Documentation build configuration
- name: Agent context
  file: agent_context.md
  purpose: Canonical context manifest protocol
dependencies:
  internal:
  - ../lx_dtypes
  external:
  - Sphinx
  - MyST
submodules: []
contracts:
- name: Standardized CSV exports
  doc: guides/standardized-csv-export.md
- name: Package authoring
  doc: guides/dtypes-package-structure.md
- name: ePA FHIR compatibility
  doc: guides/epa-fhir-compatibility.md
tests:
  directory: ../tests
  command: uv run make -C docs html

files:
- medication_plan_specification_summary.md
- german-medication-plan
