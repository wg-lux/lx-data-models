  matches: 1
  rationale: Match the scope of the reproducible checks.
- find: To test whether this approach generalizes to a terminology it was not designed around, we independently
    audited an existing MST 3.0 KnowledgeBaseConfig module against its official source tables12, sheet
    by sheet, diffing every source term against the packaged fixtures and checking full referential integrity
    — every classification, finding-type, and intervention-type reference resolving to a defined object
    — across all 957 module entries. Gaps identified were closed without changing any existing internal
    identifier, preserving backward compatibility with prior report-template references (Section 3.4).
  replace: 'To assess applicability beyond the STAR terminology, we loaded the independently authored
    MST 3.0 module through the same data-model infrastructure, validated its complete core reference graph,
    and recorded its executable concept inventory. We also reconciled the MST additions in PR #32 with
    the packaged source and checked the draft’s attribution of adverse-event severity to the official
    source’s section 7.3. These checks establish structural consistency and targeted source correspondence;
    they do not establish an exhaustive independent clinical terminology audit. The reconciliation inventory
    records the compared PR commit and exact source-prefix hashes.'
  matches: 1
  rationale: Replace the unsubstantiated sheet-by-sheet audit and 957-entry claim with the performed checks.
- find: The KnowledgeBaseConfig module “star_upper_gi” implements the Examination “star_upper_gi_endoscopy”
    (gastroscopy) with its associated Findings, Classifications, ClassificationChoices, and ClassificationChoiceDescriptors
    — for example, the Paris classification for the finding “polyp” (Supplementary Figure S2, Supplementary
    File SF2). The module contains 22 findings, 21 classifications, 71 classification choices, and 3 classification
    choice descriptors (Supplementary Table S1); a separate, reusable “lx_units” module supplies 41 Unit
    fixtures (e.g., centimeter, millimeter, second, minute). Descriptive features that fit a controlled
    vocabulary are represented as ClassificationChoices (e.g., polyp shape “star_upper_gi_paris_Ip”);
    features requiring a non-categorical input (e.g., “size_oval_mm”) remain numeric descriptors rather
    than being forced into artificial categories — a distinction that becomes relevant again in Section
    3.6.
  replace: The KnowledgeBaseConfig module “star_upper_gi” implements the Examination “star_upper_gi_endoscopy”
