  matches: 1
  rationale: Preserve the historical inventory while clearly identifying and counting the repaired artifact.
- find: 'The audit described in Section 2.4 found the module near-complete and highly faithful to its
    source: all 31 procedure-related interventions, all diagnosis/reason terms, and all ten standard classifications
    in the source’s appendix (line angle, esophageal varices, Prague, Paris, JGCA, Forrest, Goligher,
    Kudo, Bismuth, esophagogastric landmarks) matched exactly. Ten small terminology-fidelity corrections
    and one structural gap were found and closed, all as additive, identifier-preserving edits: eight
    diagnosis/finding/indication labels were corrected to the source’s exact spelling (“Angioectasia”/“Angiodysplasia”
    → “Angiectasia”, “Lymphangioectasia” → “Lymphangiectasia”), two biliary-tree classification choices
    were relabeled from an unofficial paraphrase to the source’s exact §2.2 terms (“Left/Right main duct”,
    central/peripheral), and the source’s §7.3 adverse-event severity grading table (Incident/Mild/Moderate/Severe/Fatal)
    — previously absent — was added with its five choices and four supporting outcome/action fixtures.
    The resulting knowledge base comprises 357 findings, 40 classifications, 290 classification choices,
    142 indications, 44 interventions, and 12 examinations (Table 3), with full referential integrity
    confirmed.'
  replace: 'The packaged MST 3.0 artifact (mst_3_0@3.0.0) contains 357 findings, 39 classifications, 285
    classification choices, 142 indications, 40 interventions, and 12 examinations (Table 3). Its core
    references validate successfully. The two MST source additions in PR #32 are already present byte-for-byte
    as prefixes of the existing files and do not supply additional concepts. A targeted check of the WEO
    document dated 03.08.2016 shows that section 7.3 on page 41 describes actions and outcomes, not the
    five-level adverse-event severity classification attributed to it in the earlier draft. No such severity
    extension was added to make counts match that draft. Any separately sourced extension requires explicit
    provenance and a new artifact identity.'
  matches: 1
  rationale: Use verified counts and correct the source attribution without inventing clinical entries.
