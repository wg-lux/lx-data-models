  rationale: Match the artifacts and distinguish the illustrative comparator from a guideline release.
- find: 'Professional societies have long attempted to standardize the clinical content of gastrointestinal
    endoscopy reports, from the Minimal Standard Terminology’s common vocabulary for indications, findings,
    diagnoses, and interventions onward9–12, most recently in the European Society of Gastrointestinal
    Endoscopy’s STAndardization of Reports (STAR) initiative for upper gastrointestinal endoscopy4. These
    recommendations establish clinical consensus on what should be documented, but a human-readable recommendation
    is not an executable clinical information model: implementing it in a reporting system, study database,
    or case report form additionally requires explicit data types, permissible values, terminology bindings,
    and validation rules13. Where these machine-readable artifacts are not distributed alongside the recommendation,
    institutions, research groups, and software developers must each independently interpret and implement
    the clinical content — a risk our own MST 3.0 audit illustrates concretely: ten small terminology-fidelity
    corrections were still needed against its published source tables despite two decades of prior use
    (Section 3.4).'
  replace: 'Professional societies have long attempted to standardize the clinical content of gastrointestinal
    endoscopy reports, from the Minimal Standard Terminology’s common vocabulary for indications, findings,
    diagnoses, and interventions onward9–12, most recently in the European Society of Gastrointestinal
    Endoscopy’s STAndardization of Reports (STAR) initiative for upper gastrointestinal endoscopy4. These
    recommendations establish clinical consensus on what should be documented, but a human-readable recommendation
    is not an executable clinical information model: implementing it in a reporting system, study database,
    or case report form additionally requires explicit data types, permissible values, terminology bindings,
    and validation rules13. Where these machine-readable artifacts are not distributed alongside the recommendation,
    institutions, research groups, and software developers must each independently interpret and implement
    the clinical content; executable reference checks and explicit source reconciliation therefore remain
    necessary (Section 3.4).'
  matches: 1
  rationale: The claimed ten corrections are not established by the PR or this checkout.
- find: 'In this study, we present the Layered Extraction Data Model (LXDM), an open-source, entry-validated
    data model designed to translate clinical reporting recommendations into executable data structures
    for research-oriented workflows. LXDM combines a stable generic structural model with a separately
    managed, versioned knowledge base; patient-related records reference its clinical concepts and are
    validated during construction against data types, existing references, and permissible relationships,
    and the knowledge context used during validation is retained together with the resulting, re-exportable
    dataset. Using the ESGE STAR recommendations, we implement a domain-specific knowledge-base module
    for upper gastrointestinal endoscopy4; to test whether this approach generalizes beyond a single terminology,
    we additionally audit and present a second, independently authored and more general module implementing
    the Minimal Standard Terminology (MST 3.0)12. '
  replace: 'In this study, we present the Layered Extraction Data Model (LXDM), an open-source, entry-validated
    data model designed to translate clinical reporting recommendations into executable data structures
    for research-oriented workflows. LXDM combines a stable generic structural model with a separately
