- find: Creating or modifying a KnowledgeBaseConfig module currently requires editing raw YAML text files;
    indentation errors can render a file unreadable to the DataLoader, a risk we plan to mitigate with
    a dedicated editing web application. Although the published package is thoroughly tested and developed
    under strict typing and linting standards, unexpected issues may still arise when extending the framework
    to new domains beyond the two audited here.
  replace: Raw YAML authoring remains sensitive to indentation and semantic errors. The documented authoring
    workflow combines an editing interface, YAML linting, exact version resolution and executable validation.
    These checks do not establish clinical effectiveness or exhaustive source fidelity. Future evaluation
    should assess data quality in deployed workflows and independent clinical review should accompany
    new terminology releases.
  matches: 1
  rationale: Keep limitations and conclusions consistent with the performed validation rather than an
    unverified exhaustive audit.
- find: We presented an entry-validated canonical data model designed to ensure correct data capture,
    logical consistency, and uniform persistence as a prerequisite for interoperability, and showed that
    this approach generalizes, with only minor corrections, across two independently governed endoscopy
    terminologies. By decoupling internal structure from exchange standards and externalizing domain semantics
    into a governed KnowledgeBase, the framework provides a robust foundation for high-quality clinical
    data reuse and a pathway toward reproducible, auditable, AI-ready clinical datasets across domains.
  replace: We presented an entry-validated canonical data model designed to ensure correct data capture,
