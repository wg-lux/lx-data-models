owner: lx_dtypes maintainers and manuscript authors
topic: Editorial reconciliation of LXDM draft with executable versioned artifacts
command: uv run python scripts/revise_lxdm_manuscript.py 'LXDM_revised_draft_v3(2).docx' --output temp/generated_exports/LXDM_reconciled_draft.docx
review_note: This is a separate editorial draft for author review, not a renewed clinical-source audit.
  Modified paragraphs adopt their first text run formatting; untouched DOCX parts are preserved. Review
  layout and remaining study claims before submission. Exact paragraph matching rejects changed input
  rather than silently applying edits elsewhere.
replacements:
- find: 'Methods: Using upper gastrointestinal endoscopy as a reference application, we operationalized
    the ESGE STAR recommendations into an entry-validated KnowledgeBase (Pydantic, Django; GitHub/PyPI),
    and audited an independently authored terminology, MST 3.0, against its official source tables to
    assess applicability to gastrointestinal endoscopy in general.'
  replace: 'Methods: Using upper gastrointestinal endoscopy as a reference application, we operationalized
    the ESGE STAR recommendations into an entry-validated KnowledgeBase (Pydantic, Django; GitHub/PyPI),
    and validated the references and reproducible inventory of an independently authored terminology,
    MST 3.0, with targeted checks against its official source tables to assess applicability to gastrointestinal
    endoscopy in general.'
  matches: 1
  rationale: Distinguish verified graph validation from an unsupported claim of an exhaustive source audit.
- find: 'Results: Datasets are created, validated, stored, and exchanged as structured files and SQL objects,
    each carrying the KnowledgeBase used to interpret it. The STAR-derived KnowledgeBase for gastroscopy
    reports comprises 22 findings, 21 classifications, and 71 classification choices; the audited MST
    3.0 KnowledgeBase comprises 357 findings, 40 classifications, and 290 classification choices across
    five procedure types, with full referential integrity confirmed. Screening 206 PubMed-indexed endoscopy
    data-sharing records showed only 0.5% with a FHIR/openEHR-structured representation. A runnable demonstration
    shows versioned KnowledgeBaseConfig modules applying different guideline-specific size categories
    to the same measurement without altering how it was recorded.'
  replace: 'Results: Datasets are created, validated, stored, and exchanged as structured files and SQL
    objects, each carrying the KnowledgeBase used to interpret it. The STAR-derived KnowledgeBase for
    gastroscopy reports comprises 22 findings, 21 classifications, and 79 classification choices in the
    repaired publication artifact; the packaged MST 3.0 KnowledgeBase comprises 357 findings, 39 classifications,
