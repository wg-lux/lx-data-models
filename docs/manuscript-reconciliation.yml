- find: 'A related problem arises when a continuous measurement is deliberately binned into named categories
    that carry different clinical consequences on either side of a boundary — and that boundary can change
    between guideline versions. The ESGE’s 2024 colorectal polypectomy/EMR guideline defines four size-based
    management categories, each with its own resection-technique recommendation: diminutive (≤5 mm) and
    small (6–9 mm) polyps for cold snare polypectomy, nonpedunculated 10–19 mm polyps for hot snare polypectomy,
    and large nonpedunculated colorectal polyps (LNPCPs, ≥20 mm) for conventional EMR (Ferlitsch et al.,
    2024). As we demonstrated in a previous study, literature handles thresholds for size categories inconsistently
    – especially the corresponding category for the values 5 and 10 mm23.'
  replace: Continuous measurements can be interpreted through separately versioned categorical schemes
    without replacing the original values. The ESGE 2024 colorectal polypectomy guideline describes size
    groups of ≤5, 6–9, 10–19 and ≥20 mm (Ferlitsch et al., 2024). Its treatment recommendations also depend
    on lesion characteristics and clinical context. Our example compares an illustrative binary split
    with these size groups; it does not infer treatment or transfer colorectal treatment recommendations
    to upper-GI findings.
  matches: 1
  rationale: Limit the executable demo to what it actually computes.
- find: Because LXDM externalizes categorical definitions into independently versioned KnowledgeBaseConfig
    modules rather than compiling a single boundary into the data model, both schemes can be applied side
    by side to the same underlying, non-categorically recorded value — the finding’s size_oval_mm descriptor,
    already used for the 6 mm and 8 mm polyps in the star_upper_gi demo dataset (Section 3.3) — without
    altering the recorded measurement. We implemented both as runnable modules (polyp_size_category_v1_legacy
    v1.0.0 and polyp_size_category_v2_esge2024 v2.0.0, the latter carrying the guideline’s citation and
    recommendation numbers directly in its ClassificationChoice definitions; Supplementary File SF4) and
    applied them to five illustrative measurements (Table 4). Three the legacy scheme collapses into a
    single “>5 mm” bin (6, 15, 22 mm) are correctly separated into three distinct, differently managed
    categories under the current guideline; both versions agree exactly at the shared ≤5 mm boundary.
  replace: Both schemes are published under the stable logical identity polyp_size_category, with versions
    1.0.0 and 2.0.0 selected by the existing version-aware resolver. Their numeric_rules.yml files contain
    validated executable boundaries bound to the corresponding classifications and choices. The legacy
    version is an illustrative comparator, not an historical ESGE release. Version 2 accepts whole-number
    millimeter values and rejects fractions without rounding; a continuous interpretation would require
    an explicitly versioned policy. The five measurements in Table 4 are deterministic synthetic observations.
    A separate test applies the revised grouping to the existing STAR ledger’s 8 mm polyp and verifies
    that the ledger remains unchanged; its 6 mm finding is a diverticulum, not a second polyp. Each derived
    result retains the original observation identity, value, descriptor, unit and source KB identity,
    together with the interpretation KB identity, selected choice and rule digest. The values 6, 15 and
    22 mm occupy distinct revised groups while sharing the legacy >5 mm group.
  matches: 1
  rationale: Connect the manuscript to the working resolver, rules, actual ledger and provenance.
