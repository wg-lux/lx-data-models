        - colonoscopy_screening
        - colonoscopy_lesion_removal_small
        - colonoscopy_lesion_removal_large
        - colonoscopy_lesion_removal_emr
        - colonoscopy_diagnostic_acute_symptomatic
        - colonoscopy_diagnostic_chronic_symptomatic
        - colonoscopy_surveillance_post_polypectomy
        - colonoscopy_surveillance_ibd
        - colonoscopy_surveillance_cancer_history
        - colonoscopy_follow_up_post_emr
        - colonoscopy_follow_up_post_esd
        - colonoscopy_follow_up_post_eftr
        - colonoscopy_follow_up_residual_or_recurrent_lesion
