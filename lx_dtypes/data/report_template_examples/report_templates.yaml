- model: report_template
  name: colonoscopy_training_basic
  name_de: "Koloskopie – leitlinienbasierte Qualitätsdokumentation"
  name_en: "Colonoscopy – guideline-based quality documentation"
  description: "Patientenbezogene Dokumentationsvorlage auf Grundlage der finalen DGVS-S2k-Leitlinie Qualitätsanforderungen in der gastrointestinalen Endoskopie, Version 2.1, und der DGVS-S3-Leitlinie Sedierung. Populationsbezogene Qualitätsindikatoren werden getrennt ausgewertet."
  version: "DGVS-AWMF-021-022-v2.1-2025-07"
  guideline_references:
    - guideline_id: "AWMF-021-022"
      title: "S2k-Leitlinie Qualitätsanforderungen in der gastrointestinalen Endoskopie"
      issuing_organization: "Deutsche Gesellschaft für Gastroenterologie, Verdauungs- und Stoffwechselkrankheiten (DGVS)"
      version: "2.1"
      publication_date: 2025-07-01
      canonical_url: "https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf"
      cited_sections:
        - "Statement 2.36"
        - "Kapitel 4.5 Prozessqualität – Dokumentation von Befunden"
        - "Tabelle 22 Allgemeine Qualitätsindikatoren in der Endoskopie"
        - "Kapitel 6.1 Koloskopie"
        - "Kapitel 6.1.4 Spezifische Qualitätsindikatoren Koloskopie"
    - guideline_id: "AWMF-021-014"
      title: "Aktualisierte S3-Leitlinie Sedierung in der gastrointestinalen Endoskopie"
