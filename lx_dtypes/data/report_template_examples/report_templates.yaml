- model: report_template_section
  name: eus_quality_documentation_2025
  title_de: EUS-Qualitätsdokumentation
  title_en: EUS quality documentation
  position: 0
  types: [baseline]
  findings:
    - eus_quality_informed_consent
    - eus_quality_landmarks
    - eus_quality_pancreatic_cyst_description
    - eus_quality_tissue_acquisition
    - eus_quality_adverse_events

- model: report_template
  name: eus_quality_2025
  name_de: "Endosonographie – leitlinienbasierte Qualitätsdokumentation 2025"
  name_en: "Endoscopic ultrasound – guideline-based quality documentation 2025"
  description: "Patientenbezogene EUS-Kerndokumentation zur späteren getrennten Berechnung der ESGE-Qualitätsindikatoren."
  version: "ESGE-EUS-PM-update-2025"
  guideline_references:
    - guideline_id: ESGE-EUS-PM-2025
      title: "Performance measures for endoscopic ultrasound: ESGE Quality Improvement Initiative – Update 2025"
      issuing_organization: "European Society of Gastrointestinal Endoscopy (ESGE)"
      version: "2025 update"
      publication_date: 2025-11-12
      canonical_url: "https://www.thieme-connect.com/products/ejournals/pdf/10.1055/a-2716-7763.pdf"
      cited_sections:
        - "Informed patient consent"
        - "Adequate documentation of landmarks"
        - "Standardized description of pancreatic cystic lesions"
        - "Diagnostic tissue acquisition"
        - "Adverse events"
    - guideline_id: AWMF-021-022
      title: "S2k-Leitlinie Qualitätsanforderungen in der gastrointestinalen Endoskopie"
      issuing_organization: "Deutsche Gesellschaft für Gastroenterologie, Verdauungs- und Stoffwechselkrankheiten (DGVS)"
      version: "2.1"
      publication_date: 2025-07-01
      canonical_url: "https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf"
      cited_sections: ["Kapitel 7.4 Endosonographie"]
  coverage_version: report_concept_coverage_v1
  coverage_concepts:
    - concept_id: eus.informed_consent
      label: Informierte Einwilligung
      applicability_status: required
      validator_names: [eus_informed_consent_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: eus_informed_consent, classification_name: eus_informed_consent_status}
      allowed_values: [quality_obtained, quality_not_obtained]
      guideline_citations: ["ESGE-EUS-PM-2025 measure 1: informed patient consent"]
    - concept_id: eus.landmark_documentation
      label: Standardisierte Landmarkendokumentation
      applicability_status: required
      validator_names: [eus_landmarks_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: eus_landmark_documentation, classification_name: eus_landmark_documentation_status}
      allowed_values: [quality_complete, quality_incomplete]
      guideline_citations: ["ESGE-EUS-PM-2025 measure 2: adequate documentation of landmarks"]
    - concept_id: eus.pancreatic_cyst_description
      label: Standardisierte Beschreibung pankreatischer Zysten
      applicability_status: required
      validator_names: [eus_pancreatic_cyst_description_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: eus_pancreatic_cyst_description, classification_name: eus_pancreatic_cyst_description_status}
      allowed_values: [quality_complete, quality_incomplete, quality_not_applicable]
      guideline_citations: ["ESGE-EUS-PM-2025 measure 4: standardized pancreatic cyst description"]
    - concept_id: eus.tissue_acquisition
      label: Diagnostische Gewebegewinnung
      applicability_status: required
      validator_names: [eus_tissue_acquisition_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: eus_tissue_acquisition, classification_name: eus_tissue_acquisition_result}
      allowed_values: [quality_diagnostic, quality_nondiagnostic, quality_not_applicable]
      guideline_citations: ["ESGE-EUS-PM-2025 measure 5: diagnostic tissue acquisition"]
    - concept_id: eus.adverse_events
      label: Unerwünschte Ereignisse
      applicability_status: required
      validator_names: [eus_adverse_events_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: eus_adverse_events, classification_name: eus_adverse_event_status}
      allowed_values: [quality_absent, quality_present, quality_unknown]
      guideline_citations: ["ESGE-EUS-PM-2025 measure 6: adverse events"]
  examination: endoscopic_ultrasound
  report_sections: [eus_quality_documentation_2025]
  validators:
    examination_validators: [eus_quality_2025_minimum_documentation]
    findings_validators:
      - eus_informed_consent_documented
      - eus_landmarks_documented
      - eus_pancreatic_cyst_description_documented
      - eus_tissue_acquisition_documented
      - eus_adverse_events_documented
