- model: report_template
  name: ercp_quality_2018
  name_de: "ERCP – leitlinienbasierte Qualitätsdokumentation"
  name_en: "ERCP – guideline-based quality documentation"
  description: "Patientenbezogene ERCP-Dokumentation der für die ESGE-Qualitätsindikatoren erforderlichen Kerndaten; populationsbezogene Raten werden getrennt aggregiert."
  version: "ESGE-ERCP-PM-2018"
  guideline_references:
    - guideline_id: ESGE-ERCP-EUS-PM-2018
      title: "Performance measures for ERCP and endoscopic ultrasound"
      issuing_organization: "European Society of Gastrointestinal Endoscopy (ESGE)"
      version: "2018"
      publication_date: 2018-10-19
      canonical_url: "https://www.esge.com/ercp-and-eus"
      cited_sections:
        - "Adequate antibiotic prophylaxis before ERCP"
        - "Bile duct cannulation rate"
        - "Appropriate biliary stent placement"
        - "Bile duct stone extraction"
        - "Post-ERCP pancreatitis"
    - guideline_id: AWMF-021-022
      title: "S2k-Leitlinie Qualitätsanforderungen in der gastrointestinalen Endoskopie"
      issuing_organization: "Deutsche Gesellschaft für Gastroenterologie, Verdauungs- und Stoffwechselkrankheiten (DGVS)"
      version: "2.1"
      publication_date: 2025-07-01
      canonical_url: "https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf"
      cited_sections: ["Kapitel 7.1 ERCP", "Kapitel 7.1.5 Spezifische Qualitätsindikatoren"]
  coverage_version: report_concept_coverage_v1
  coverage_concepts:
    - concept_id: ercp.antibiotic_prophylaxis
      label: Antibiotikaprophylaxe
      applicability_status: required
      validator_names: [ercp_antibiotic_prophylaxis_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: ercp_antibiotic_prophylaxis, classification_name: ercp_antibiotic_prophylaxis_status}
      allowed_values: [quality_adequate, quality_inadequate, quality_not_indicated, quality_unknown]
      guideline_citations: ["ESGE-ERCP-EUS-PM-2018: adequate antibiotic prophylaxis before ERCP"]
    - concept_id: ercp.bile_duct_cannulation
      label: Selektive Gallengangskanülierung
      applicability_status: required
      validator_names: [ercp_bile_duct_cannulation_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: ercp_bile_duct_cannulation, classification_name: ercp_bile_duct_cannulation_outcome}
      allowed_values: [quality_successful, quality_unsuccessful, quality_not_attempted]
      guideline_citations: ["ESGE-ERCP-EUS-PM-2018: bile duct cannulation rate"]
    - concept_id: ercp.biliary_stent_placement
      label: Angemessenheit der biliären Stentimplantation
      applicability_status: required
      validator_names: [ercp_biliary_stent_placement_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: ercp_biliary_stent_placement, classification_name: ercp_biliary_stent_placement_outcome}
      allowed_values: [quality_appropriate, quality_not_appropriate, quality_not_applicable]
      guideline_citations: ["ESGE-ERCP-EUS-PM-2018: appropriate stent placement"]
    - concept_id: ercp.bile_duct_stone_extraction
      label: Vollständigkeit der Gallengangssteinextraktion
      applicability_status: required
      validator_names: [ercp_bile_duct_stone_extraction_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: ercp_bile_duct_stone_extraction, classification_name: ercp_bile_duct_stone_extraction_outcome}
      allowed_values: [quality_complete, quality_incomplete, quality_not_applicable]
      guideline_citations: ["ESGE-ERCP-EUS-PM-2018: bile duct stone extraction"]
    - concept_id: ercp.post_ercp_pancreatitis
      label: Post-ERCP-Pankreatitis
      applicability_status: required
      validator_names: [ercp_post_ercp_pancreatitis_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: ercp_post_ercp_pancreatitis, classification_name: ercp_post_ercp_pancreatitis_status}
      allowed_values: [quality_absent, quality_present, quality_unknown]
      guideline_citations: ["ESGE-ERCP-EUS-PM-2018: post-ERCP pancreatitis"]
  examination: ercp
  report_sections: [ercp_quality_documentation_2018]
  validators:
    examination_validators: [ercp_quality_documentation_minimum]
    findings_validators:
      - ercp_antibiotic_prophylaxis_documented
      - ercp_bile_duct_cannulation_documented
      - ercp_biliary_stent_placement_documented
      - ercp_bile_duct_stone_extraction_documented
      - ercp_post_ercp_pancreatitis_documented

