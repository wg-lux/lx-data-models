- model: findings_validator
  name: polyp_has_lst_if_large
  finding: esophagus_polyp
  operator: conditional
  query:
    finding: esophagus_polyp
    operator: conditional
    condition:
      any:
        - classification: size_mm
          comparator: gt
          value: 10
        - classification: size_cat
          comparator: eq
          value: large
      then_requires:
        - classification: lst

- model: report_finding
  name: star_upper_gi_mucosa_esophagus_abnormal
  finding: star_upper_gi_mucosa_esophagus_abnormal
  required: true
  multiple_allowed: false
  classifications: []

- model: report_template_section
  name: examination_baseline
  position: 0
  types: []
  findings:
    - finding: esophagus_polyp
      required: false
      multiple_allowed: true
      classifications:
        - classification: size_mm
          required: true

- model: report_template_section
  name: xx
  position: 1
  types: []
  findings: []

- model: findings_validator
  name: star_upper_gi_mucosa_esophagus_abnormal_reported
  finding: star_upper_gi_mucosa_esophagus_abnormal
  operator: exists
  query:
    finding: star_upper_gi_mucosa_esophagus_abnormal
    operator: exists

- model: examination_validator
  name: gastroscopy_has_baseline_info
  finding_validators:
    - star_upper_gi_mucosa_esophagus_abnormal_reported
  examination_validators: []

- model: examination_validator
  name: star_upper_gi_main
  finding_validators:
    - star_upper_gi_mucosa_esophagus_abnormal_reported
  examination_validators: []

- model: report_template
  name: star_upper_gi_main
  examination: star_upper_gi_endoscopy
  report_sections:
    - examination_baseline
    - xx
  validators:
    examination_validators:
      - gastroscopy_has_baseline_info
    findings_validators:
      - polyp_has_lst_if_large

- model: report_template
  name: ukw_gastroscopy
  examination: star_upper_gi_endoscopy
  report_sections: []
  validators:
    examination_validators: []
    findings_validators: []

- model: report_finding
  name: base_required_finding
  finding: base_required_finding
  required: true
  multiple_allowed: false
  classifications: []

- model: report_template_section
  name: base_required_section
  position: 0
  types:
    - baseline
  findings:
    - base_required_finding

- model: report_template
  name: base_report_template
  examination: generic_endoscopy
  report_sections:
    - base_required_section
  validators:
    examination_validators: []
    findings_validators: []

- model: findings_validator
  name: colonoscopy_training_deepest_location_recorded
  finding: colonoscopy_deepest_viewed_location
  operator: exists
  query:
    finding: colonoscopy_deepest_viewed_location
    operator: exists

- model: findings_validator
  name: colonoscopy_training_polyp_recorded
  finding: colon_polyp
  operator: exists
  query:
    finding: colon_polyp
    operator: exists

- model: examination_validator
  name: colonoscopy_training_minimum_documentation
  finding_validators:
    - colonoscopy_training_deepest_location_recorded
  examination_validators: []

- model: report_finding
  name: colonoscopy_training_bowel_prep_simplified
  finding: bowel_preparation_simplified
  required: true
  multiple_allowed: false
  classifications:
    - classification: bowel_prep_boston_simplified
      required: true

- model: report_finding
  name: colonoscopy_training_deepest_location
  finding: colonoscopy_deepest_viewed_location
  required: true
  multiple_allowed: false
  classifications:
    - classification: colonoscopy_location_default
      required: true
    - classification: colonoscopy_not_complete_reason
      required: false

- model: report_finding
  name: colonoscopy_training_withdrawal_time
  finding: colonoscopy_withdrawal_time_minutes
  required: true
  multiple_allowed: false
  classifications:
    - classification: time_minutes_generic
      required: true

- model: report_finding
  name: colonoscopy_training_polyp
  finding: colon_polyp
  required: false
  multiple_allowed: true
  classifications:
    - classification: colonoscopy_location_default
      required: true
    - classification: lesion_size_mm
      required: true
    - classification: colon_lesion_paris
      required: false

- model: report_finding
  name: colonoscopy_training_diverticule
  finding: colon_diverticule
  required: false
  multiple_allowed: true
  classifications:
    - classification: colonoscopy_location_default
      required: true

- model: report_template_section
  name: colonoscopy_training_baseline
  position: 0
  types:
    - baseline
  findings:
    - colonoscopy_training_bowel_prep_simplified
    - colonoscopy_training_deepest_location
    - colonoscopy_training_withdrawal_time

- model: report_template_section
  name: colonoscopy_training_observations
  position: 1
  types:
    - findings
  findings:
    - colonoscopy_training_polyp
    - colonoscopy_training_diverticule

- model: report_template
  name: colonoscopy_training_basic
  examination: colonoscopy
  report_sections:
    - colonoscopy_training_baseline
    - colonoscopy_training_observations
  validators:
    examination_validators:
      - colonoscopy_training_minimum_documentation
    findings_validators:
      - colonoscopy_training_polyp_recorded
