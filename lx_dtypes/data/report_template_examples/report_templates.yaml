      version: "2023"
      publication_date: 2023-10-01
      canonical_url: "https://register.awmf.org/assets/guidelines/021-014l_S3_Sedierung_in_der_gastrointestinalen_Endoskopie_2023-10.pdf"
      cited_sections:
        - "Kapitel 3.4 Überwachung während und nach Sedierung"
        - "Empfehlung 3.9"
        - "Kapitel 5.4 Dokumentation"
        - "Empfehlung 5.10"
  coverage_version: report_concept_coverage_v1
  coverage_concepts:
    - concept_id: koloskopie.patientenidentitaet
      label: Patientenidentität
      applicability_status: required
