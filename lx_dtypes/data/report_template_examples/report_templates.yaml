- model: report_template
  name: colonoscopy_training_basic
  name_de: "Koloskopie – Qualitätsdokumentation nach S2k-Konsultationsfassung"
  description: "Patientenbezogene Dokumentationsvorlage auf Grundlage der S2k-Konsultationsfassung Qualitätsanforderungen in der gastrointestinalen Endoskopie, Stand Juli 2025, insbesondere Kapitel 4.5 und 6.1. Populationsbezogene Qualitätsindikatoren werden getrennt ausgewertet."
  version: "S2k-Konsultationsfassung-2025-07"
  coverage_version: report_concept_coverage_v1
  coverage_concepts:
    - concept_id: koloskopie.sedierungsstatus
      label: Sedierungsstatus
      applicability_status: required
      validator_names:
        - koloskopie_sedierung_dokumentiert
      evidence_path:
        - patient_findings
      finding_selector:
        finding_name: sedation_endoscopy
        classification_name: sedation_performed
      allowed_values:
        - "yes"
        - "no"
        - "unknown"
    - concept_id: koloskopie.medikationsstatus
      label: Medikationsstatus der Untersuchung
      applicability_status: required
      validator_names:
        - koloskopie_medikationsstatus_dokumentiert
        - koloskopie_medikationsgabe_wenn_verabreicht
      evidence_path:
        - patient_findings
      finding_selector:
        finding_name: endoscopy_medication_status
        classification_name: endoscopy_medication_documentation_status
      allowed_values:
        - documented_none
        - documented_present
        - documented_unknown
    - concept_id: koloskopie.bbps.linkes_kolon
      label: BBPS linkes Kolon
      applicability_status: required
      validator_names:
        - koloskopie_darmvorbereitung_linkes_kolon_dokumentiert
      evidence_path:
        - patient_findings
      finding_selector:
        finding_name: bowel_preparation_lc
        classification_name: bowel_prep_boston
      allowed_values:
        - bowel_prep_boston_0
        - bowel_prep_boston_1
        - bowel_prep_boston_2
        - bowel_prep_boston_3
    - concept_id: koloskopie.bbps.transversum
      label: BBPS Colon transversum
      applicability_status: required
      validator_names:
        - koloskopie_darmvorbereitung_transversum_dokumentiert
      evidence_path:
        - patient_findings
      finding_selector:
        finding_name: bowel_preparation_tc
        classification_name: bowel_prep_boston
      allowed_values:
        - bowel_prep_boston_0
        - bowel_prep_boston_1
        - bowel_prep_boston_2
        - bowel_prep_boston_3
    - concept_id: koloskopie.bbps.rechtes_kolon
      label: BBPS rechtes Kolon
      applicability_status: required
      validator_names:
        - koloskopie_darmvorbereitung_rechtes_kolon_dokumentiert
      evidence_path:
        - patient_findings
      finding_selector:
        finding_name: bowel_preparation_rc
        classification_name: bowel_prep_boston
      allowed_values:
        - bowel_prep_boston_0
        - bowel_prep_boston_1
        - bowel_prep_boston_2
        - bowel_prep_boston_3
    - concept_id: koloskopie.maximale_reichweite
