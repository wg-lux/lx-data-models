      concept_value_path: [patient]
      value_constraint: non_empty_string
      guideline_citations:
        - "AWMF-021-022 Statement 2.36: Patientenidentifikation"
    - concept_id: koloskopie.indikation
      label: Untersuchungsindikation
      applicability_status: required
      validator_names: []
      evidence_path: [patient_indications, "0", indication]
      concept_value_path: [patient_indications, "0", indication]
      allowed_values:
