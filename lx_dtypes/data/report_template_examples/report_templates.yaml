- model: report_template
  name: upper_gi_quality_2025
  name_de: "ÖGD – leitlinienbasierte Qualitätsdokumentation 2025"
  name_en: "Upper GI endoscopy – guideline-based quality documentation 2025"
  description: "Strukturierte ÖGD-Basisdokumentation mit vollständiger Inspektion von Ösophagus, Magen und Duodenum sowie standardisierten Landmarken nach der ESGE Quality Improvement Initiative 2025 und der DGVS-S2k-Leitlinie Version 2.1."
  version: "ESGE-upper-GI-2025"
  guideline_references:
    - guideline_id: "ESGE-UGI-PM-2025"
      title: "Performance measures for upper gastrointestinal endoscopy: ESGE Quality Improvement Initiative update 2025"
      issuing_organization: "European Society of Gastrointestinal Endoscopy (ESGE)"
      version: "2025 update"
      publication_date: 2025-09-11
      canonical_url: "https://www.esge.com/performance-measures-for-upper-gi-endoscopy-esge-quality-improvement-initiative-update-2025/"
      cited_sections:
        - "Complete examination of the esophagus, stomach, and duodenum"
        - "Photodocumentation of anatomical landmarks and abnormal findings"
        - "Use of standardized terminology and validated classifications"
    - guideline_id: "ESGE-STAR-UGI-2025"
      title: "STAndardization of Reports (STAR project) Upper gastrointestinal endoscopy"
      issuing_organization: "European Society of Gastrointestinal Endoscopy (ESGE)"
      version: "2025 position statement"
      publication_date: 2025-08-20
      canonical_url: "https://www.esge.com/assets/downloads/pdfs/guidelines/2025_a-2652-8941.pdf"
      cited_sections:
        - "Preprocedure report information"
        - "Endoscopic findings: report structure, esophagus, stomach, and duodenum"
        - "Postprocedure report information"
    - guideline_id: "AWMF-021-022"
      title: "S2k-Leitlinie Qualitätsanforderungen in der gastrointestinalen Endoskopie"
      issuing_organization: "Deutsche Gesellschaft für Gastroenterologie, Verdauungs- und Stoffwechselkrankheiten (DGVS)"
      version: "2.1"
      publication_date: 2025-07-01
      canonical_url: "https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf"
      cited_sections:
        - "Statement 2.36"
        - "Kapitel 5.1 Ösophagogastroduodenoskopie"
  coverage_version: report_concept_coverage_v1
  coverage_concepts:
    - concept_id: upper_gi.mucosa.esophagus_status
      label: Mukosastatus Ösophagus
      applicability_status: required
      validator_names: [star_upper_gi_mucosa_esophagus_abnormal_reported]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_mucosa_esophagus_abnormal
        classification_name: yes_no_unknown_classification
      allowed_values: ["yes", "no", unknown]
      guideline_citations:
        - "ESGE-UGI-PM-2025: complete examination of the esophagus"
        - "ESGE-STAR-UGI-2025: endoscopic findings – esophagus"
    - concept_id: upper_gi.mucosa.stomach_status
      label: Mukosastatus Magen
      applicability_status: required
      validator_names: [upper_gi_stomach_mucosa_documented]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_mucosa_stomach_abnormal
        classification_name: yes_no_unknown_classification
      allowed_values: ["yes", "no", unknown]
      guideline_citations:
        - "ESGE-UGI-PM-2025: complete examination of the stomach"
        - "ESGE-STAR-UGI-2025: endoscopic findings – stomach"
    - concept_id: upper_gi.mucosa.duodenum_status
      label: Mukosastatus Duodenum
      applicability_status: required
      validator_names: [upper_gi_duodenum_mucosa_documented]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_mucosa_duodenum_abnormal
        classification_name: yes_no_unknown_classification
      allowed_values: ["yes", "no", unknown]
      guideline_citations:
        - "ESGE-UGI-PM-2025: complete examination of the duodenum"
        - "ESGE-STAR-UGI-2025: endoscopic findings – duodenum"
    - concept_id: upper_gi.landmark.esophagogastric_junction_cm
      label: Distanz des gastroösophagealen Übergangs
      applicability_status: required
      validator_names: [upper_gi_esophagogastric_junction_documented]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_location_esophagogastric_junction
        classification_name: distance_cm
      concept_value_path: [patient_finding_classification_choice_descriptors, "0", descriptor_value]
      value_constraint: number_range
      numeric_min: 0
      numeric_max: 100
      guideline_citations:
        - "ESGE-UGI-PM-2025: anatomical landmark documentation"
    - concept_id: upper_gi.landmark.hiatus_cm
      label: Distanz des Hiatus
      applicability_status: required
      validator_names: [upper_gi_hiatus_documented]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_location_hiatus
        classification_name: distance_cm
      concept_value_path: [patient_finding_classification_choice_descriptors, "0", descriptor_value]
      value_constraint: number_range
      numeric_min: 0
      numeric_max: 100
      guideline_citations:
        - "ESGE-UGI-PM-2025: anatomical landmark documentation"
    - concept_id: upper_gi.landmark.squamocolumnar_junction_cm
      label: Distanz der Z-Linie
      applicability_status: required
      validator_names: [upper_gi_squamocolumnar_junction_documented]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_location_squamocolumnar_junction
        classification_name: distance_cm
      concept_value_path: [patient_finding_classification_choice_descriptors, "0", descriptor_value]
      value_constraint: number_range
      numeric_min: 0
      numeric_max: 100
      guideline_citations:
        - "ESGE-UGI-PM-2025: anatomical landmark documentation"
    - concept_id: upper_gi.imaging.esophagus_modality
      label: Bildgebungsmodalität im Ösophagus
      applicability_status: required
      validator_names: [upper_gi_esophagus_imaging_modality_documented]
      evidence_path: [patient_findings]
      finding_selector:
        finding_name: star_upper_gi_imaging_modality_esophagus
        classification_name: upper_gi_esophagus_imaging_modality_classification
      allowed_values:
        - star_upper_gi_imaging_modality_white_light
        - star_upper_gi_imaging_modality_narrow_band_imaging
        - star_upper_gi_imaging_modality_chromoendoscopy
        - star_upper_gi_imaging_modality_acidic_staining
      guideline_citations:
        - "ESGE-UGI-PM-2025: standardized imaging and photodocumentation"
  examination: star_upper_gi_endoscopy
  report_sections:
    - upper_gi_quality_2025_landmarks_and_completeness
  validators:
    examination_validators:
      - upper_gi_quality_2025_minimum_documentation
    findings_validators:
      - star_upper_gi_mucosa_esophagus_abnormal_reported
