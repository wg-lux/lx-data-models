  required: true
  multiple_allowed: false
  classifications: [{classification: eus_landmark_documentation_status, required: true}]

- model: report_finding
  name: eus_quality_pancreatic_cyst_description
  finding: eus_pancreatic_cyst_description
  required: true
  multiple_allowed: false
  classifications: [{classification: eus_pancreatic_cyst_description_status, required: true}]

- model: report_finding
  name: eus_quality_tissue_acquisition
  finding: eus_tissue_acquisition
