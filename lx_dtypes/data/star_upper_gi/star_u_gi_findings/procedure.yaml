# Preprocedure information required by the STAR Upper GI 2025 position statement.
- model: finding
  name: star_upper_gi_exam_date
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_patient_name
  description: "Patient identity concept; host applications should source it from the typed patient record."
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_patient_date_of_birth
  description: "Patient date-of-birth concept; host applications should source it from the typed patient record."
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_exam_indication
  description: "Clinical indication for the upper gastrointestinal endoscopy."
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_antithrombotic_use
  description: "Whether the patient is taking antiplatelets, anticoagulants, or heparins."
  finding_types: [preprocedure, mandatory]
  classifications: [yes_no_unknown_classification]

- model: finding
  name: star_upper_gi_antithrombotic_agent
  description: "Name of each antithrombotic agent taken by the patient."
  finding_types: [preprocedure, conditonal]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_antithrombotic_management
  description: "Whether antithrombotic therapy remained active or was interrupted, including when."
  finding_types: [preprocedure, conditonal]
  classifications: [star_upper_gi_antithrombotic_management, star_upper_gi_text]

- model: finding
  name: star_upper_gi_fasting_solids
  description: "Fasting time for solid food, recorded in minutes."
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_duration_minutes]

- model: finding
  name: star_upper_gi_fasting_liquids
  description: "Fasting time for liquids, recorded in minutes."
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_duration_minutes]

- model: finding
  name: star_upper_gi_premedication
  description: "Premedication such as simethicone, N-acetylcysteine, or another agent."
  finding_types: [preprocedure, mandatory]
  classifications: [star_upper_gi_text]

# Periprocedure information and mucosal cleanliness.
- model: finding
  name: star_upper_gi_drugs_during_endoscopy
  description: "Drugs administered during endoscopy, including topical anesthesia, sedation, adjuncts, and reversal agents."
  finding_types: [periprocedure, mandatory]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_endoscope_type
  description: "Endoscope type and relevant imaging technology or traceability identifier."
  finding_types: [periprocedure, mandatory]
  classifications: [star_upper_gi_text]

- model: finding
  name: star_upper_gi_cleanliness_assessment
  description: "Named GRACE, PEACE, or Barcelona scale with segment and total scores."
  finding_types: [periprocedure, mandatory]
  classifications:
    - star_upper_gi_cleanliness_scale
    - star_upper_gi_cleanliness_total_0_9
    - star_upper_gi_cleanliness_total_0_10

- model: finding
  name: star_upper_gi_cleanliness_esophagus
  description: "Mucosal cleanliness score for the esophagus."
  finding_types: [periprocedure, mandatory]
  classifications:
    - star_upper_gi_grace_segment_score
    - star_upper_gi_peace_segment_score
    - star_upper_gi_barcelona_segment_score
- model: finding
  name: star_upper_gi_cleanliness_stomach
  description: "Combined mucosal cleanliness score for the stomach when GRACE or PEACE is used."
  finding_types: [periprocedure, mandatory]
  classifications: [star_upper_gi_grace_segment_score, star_upper_gi_peace_segment_score]
- model: finding
  name: star_upper_gi_cleanliness_gastric_fundus
  description: "Mucosal cleanliness score for the gastric fundus when the Barcelona scale is used."
  finding_types: [periprocedure, optional]
  classifications: [star_upper_gi_barcelona_segment_score]
- model: finding
  name: star_upper_gi_cleanliness_gastric_corpus
  description: "Mucosal cleanliness score for the gastric corpus when the Barcelona scale is used."
  finding_types: [periprocedure, optional]
  classifications: [star_upper_gi_barcelona_segment_score]
- model: finding
  name: star_upper_gi_cleanliness_gastric_antrum
  description: "Mucosal cleanliness score for the gastric antrum when the Barcelona scale is used."
  finding_types: [periprocedure, optional]
  classifications: [star_upper_gi_barcelona_segment_score]
- model: finding
  name: star_upper_gi_cleanliness_duodenum
  description: "Mucosal cleanliness score for the duodenum."
  finding_types: [periprocedure, mandatory]
  classifications:
    - star_upper_gi_grace_segment_score
    - star_upper_gi_peace_segment_score
    - star_upper_gi_barcelona_segment_score

- model: finding
  name: star_upper_gi_previous_surgery_reconstruction
  description: "Type of previous upper-GI surgery and reconstruction, when applicable."
  classifications: [star_upper_gi_text]

# Postprocedure information.
- model: finding
  name: star_upper_gi_biopsy_documentation
  description: "Random or targeted biopsy with location and number of samples for each area."
  finding_types: [postprocedure, mandatory]
  classifications:
    - star_upper_gi_biopsy_type
    - star_upper_gi_location_classification
    - star_upper_gi_count
    - additional_text_info
  interventions: [star_upper_gi_biopsy_performed]

- model: finding
  name: star_upper_gi_histology_vials
  description: "Number of vials and specification of the specimens in each vial."
  finding_types: [postprocedure, mandatory]
  classifications: [star_upper_gi_count, star_upper_gi_text]

- model: finding
  name: star_upper_gi_photodocumentation
  description: "Photographs of normal landmarks and at least one image of every abnormal finding."
  finding_types: [postprocedure, mandatory]
  classifications: [star_upper_gi_photo_landmark, star_upper_gi_count]

- model: finding
  name: star_upper_gi_exam_duration
  description: "Total time from intubation to extubation."
  finding_types: [postprocedure, mandatory]
  classifications: [star_upper_gi_duration_minutes]

- model: finding
  name: star_upper_gi_staff_and_roles
  description: "Names and roles of all staff involved in the procedure."
  finding_types: [postprocedure, mandatory]
  classifications: [star_upper_gi_text]
