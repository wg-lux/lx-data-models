sidecars:
- path: terminology/mst_3_0_terminology/excel_source.yml
  contract: MST Excel source evidence
  notes: Workbook cells, attribute provenance and reviewed import decisions; not KB records.
  validation: Regenerated and checked by scripts/import_mst_excel.py using ImportSpec and Workbook.
- path: terminology/coloreg_terminology/annotation_mappings.yml
  contract: coloreg_annotation_mapping_v1
  notes: Mapping declares coloreg@0.1.0 intentionally; directory location does not change its declared
    target.
  validation: Host-owned sidecar schema; not validated by the core KB record loader.
- path: terminology/polyp_size_category/numeric_rules.yml
  contract: NumericClassificationRules
  notes: Versioned executable numeric classification rules.
- path: terminology/versions/coloreg/0.1.0/coloreg/annotation_mappings.yml
  contract: coloreg_annotation_mapping_v1
  notes: Mapping declares coloreg@0.1.0 intentionally; directory location does not change its declared
    target.
  validation: Host-owned sidecar schema; not validated by the core KB record loader.
- path: terminology/versions/polyp_size_category/1.0.0/polyp_size_category/numeric_rules.yml
  contract: NumericClassificationRules
  notes: Versioned executable numeric classification rules.
- path: terminology/versions/coloreg/0.2.0/coloreg/annotation_mappings.yml
  contract: coloreg_annotation_mapping_v1
  notes: Retained unchanged; declared mapping target remains coloreg@0.1.0.
  validation: Host-owned sidecar schema; not validated by the core KB record loader.
historical_exceptions:
- path: terminology/versions/coloreg/0.1.0/lx_utils/gender/default.yaml
  reason: Unselected legacy Django fixture, not a valid KB model record. Retained only to preserve the
    historical artifact.
- path: terminology/versions/coloreg/0.1.0/lx_utils/tag/default.yaml
  reason: Unselected empty placeholder; not a definition.
- path: terminology/versions/star_upper_gi/0.1.1.post1/star_upper_gi/star_u_gi_interventions/data.yaml
  reason: Unselected biopsy intervention draft. It is not part of the resolved historical KB; retained
    as published.
- path: terminology/versions/star_upper_gi/0.1.1.post1/star_upper_gi/config.yaml
  reason: 22 template_finding_missing_description warnings; use current star_upper_gi@0.1.2 for complete
    descriptions.
excluded_resources:
- path: ../../demo-data/legacy_exports/
  reason: Legacy CSV exports and unselected Django gender fixture; not packaged definitions.
- path: ../../demo-data/drafts/
  reason: Incomplete authoring examples. ColoReg findings draft had an invalid modl key and no definition
    identity; now an explicit empty record list.
- path: ../../demo-data/drafts/coloreg/minor_bleeding.yml
  reason: Preserved concurrent draft verbatim; finding bleeding is not declared in the ColoReg graph and
    classification is empty. Requires author clarification before inclusion.
migration:
  terminology: data/<package> -> data/terminology/<package>
  study_metadata: data/study_setup/research.yml -> data/study_metadata/research.yml
  dgvs_manifest: data/terminology/config.yaml -> data/terminology/DGVS_Terminology/config.yaml
  compatibility: Reporting module names and versions are preserved; current paths, concept provenance
    and content digests change. Historical release bytes and existing hydrated registry copies are unchanged.
  report_templates: Current reporting packages move to data/report_templates/<package>; concept definitions
    move to data/terminology/<package>_terminology.
report_templates:
- manifest: report_templates/coloreg/config.yaml
  module: coloreg
  version: 0.3.0
  role: current
  required_checks: *id001
- manifest: report_templates/dgvs_reporting/config.yaml
