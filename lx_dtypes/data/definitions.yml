schema_version: '1.0'
owner: lx-dtypes maintainers
purpose: Definition contracts and resource inventory; not a runtime package manifest.
criteria:
- Terminology uses a config.yaml with an exact name/version and explicitly selected flat model records.
- Resolve each dependency closure without competing releases, then validate with DataLoader and strict
  KB YAML lint.
- Study documents use StudySetupDefinition or StudyMetadata and are never selected as KB record lists.
- Historical package YAML paths and bytes retain their published content_sha256.
- Structural validity does not establish clinical approval or downstream host projection support.
- Current report_templates packages contain reporting records and validators only; concept definitions
  belong in terminology dependencies.
study_metadata:
- path: study_metadata/research.yml
  contract: lx_dtypes.models.contracts.study_setup.StudySetupDefinition
  purpose: Research dataset and cohort example; no approved center or age restrictions declared.
- path: study_metadata/coloreg_resection.yml
  contract: lx_dtypes.models.contracts.study_setup.StudySetupDefinition
  purpose: EMR/ESD hypotheses, candidate cohorts, exact terminology dependency, executable descriptive
    R0 analysis and explicit protocol-dependent analysis drafts.
