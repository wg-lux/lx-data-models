- manifest: report_templates/report_template_examples/config.yaml
  module: report_template_examples
  version: 0.1.1
  role: current
  required_checks: *id003
- manifest: report_templates/star_upper_gi/config.yaml
  module: star_upper_gi
  version: 0.1.2
  role: current
  required_checks: *id004

source_provenance:
  owner: lx-dtypes maintainers
  scope: Current working packages; retained release bytes and attribution remain unchanged.
  interpretation: >-
    Module sources describe origin and applicability, not a claim that every record
    is a verbatim guideline term. File-level source comments and report-template
    guideline_references identify the guideline-derived subsets. Unsourced legacy
    records remain explicitly local vocabulary; do not infer clinical approval.
  translation_policy: >-
    English display labels translate the existing German labels. Established score,
    classification and product names may be identical in both languages. Labels do
    not change identifiers, numerical boundaries, requiredness or clinical meaning.
  sources:
    local_vocabulary:
      kind: repository_authored
      authority: lx-dtypes maintainers
      canonical_document: README.md
      scope: Legacy clinical vocabulary, technical types, units, device labels and composition modules.
      limitation: No record-level external guideline attribution is asserted unless supplied in the owning YAML.
    dgvs_quality_2_1:
      kind: guideline_adaptation
      authority: DGVS
      version: '2.1'
      url: https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf
      scope: Explicitly cited endoscopy documentation, process and quality requirements; see source comments and cited_sections.
    dgvs_sedation_2023:
      kind: guideline_adaptation
      authority: DGVS
      version: '2023'
      url: https://register.awmf.org/assets/guidelines/021-014l_S3_Sedierung_in_der_gastrointestinalen_Endoskopie_2023-10.pdf
      scope: Explicitly cited sedation, medication and monitoring records.
    esge_star_2025:
      kind: guideline_adaptation
      authority: ESGE
      version: '2025'
      url: https://www.esge.com/assets/downloads/pdfs/guidelines/2025_a-2652-8941.pdf
      doi: 10.1055/a-2652-8941
      scope: Upper-GI reporting requirements and associated local capture terminology, not treatment recommendations.
    weo_mst_3_0:
      kind: terminology_adaptation
      authority: World Endoscopy Organization
      version: '3.0'
      url: https://www.worldendo.org/assets-craft/pdf/resources/mst-3-0.pdf
      scope: MST concepts with section references in the owning YAML; reporting adapters are repository-authored.
      limitation: See docs/data-reconciliation.yml for the limits of the source audit; no unsupported severity table is claimed.
    esge_polypectomy_2024:
      kind: guideline_adaptation
      authority: ESGE
      version: '2024'
      url: https://www.esge.com/assets/downloads/pdfs/guidelines/2024_a-2304-3219.pdf
      doi: 10.1055/a-2304-3219
      scope: Size grouping only; treatment recommendations and lesion context are outside this executable classifier.
    ucum:
      kind: technical_standard
      authority: UCUM
      url: https://ucum.org/ucum
      scope: Only unit records explicitly citing UCUM; this catalogue is not a complete UCUM implementation.
    endoreg_reference_snapshot:
      kind: repository_snapshot
      authority: EndoReg database reference catalogue maintainers
      canonical_document: docs/guides/dtypes-package-structure.md
      scope: Typed reference, workforce and sustainability snapshots; no external clinical guideline attribution is inferred.
    coloreg_protocol:
      kind: study_authored
      authority: ColoReg study authors
      canonical_document: docs/guides/coloreg-resection-study.yml
      study_document: lx_dtypes/data/study_metadata/coloreg_resection.yml
      scope: Study capture and linkage definitions; cohort selection remains a separate host contract.
    synthetic_examples:
      kind: educational
      authority: lx-dtypes maintainers
      canonical_document: lx_dtypes/data/report_templates/report_template_examples/README.md
      scope: Synthetic authoring examples; not clinical or institutional reporting protocols.
  module_sources:
    DGVS_Terminology: [local_vocabulary, dgvs_quality_2_1, dgvs_sedation_2023]
    citations: [local_vocabulary]
    information_source_data: [local_vocabulary]
    lx_classification_choices: [local_vocabulary, dgvs_quality_2_1, dgvs_sedation_2023]
    lx_classifications: [local_vocabulary, dgvs_quality_2_1, dgvs_sedation_2023]
    lx_descriptors: [local_vocabulary, dgvs_quality_2_1, dgvs_sedation_2023]
    lx_examinations: [local_vocabulary]
    lx_findings: [local_vocabulary, dgvs_quality_2_1, dgvs_sedation_2023]
    lx_hardware: [local_vocabulary]
    lx_indications: [local_vocabulary]
    lx_interventions: [local_vocabulary, dgvs_quality_2_1]
    lx_units: [local_vocabulary, ucum, dgvs_sedation_2023]
    lx_utils: [local_vocabulary]
    lx_utils_units: [local_vocabulary, ucum, dgvs_sedation_2023]
    lx_unit_types: [local_vocabulary]
    gender_data: [endoreg_reference_snapshot]
    tag_data: [endoreg_reference_snapshot]
