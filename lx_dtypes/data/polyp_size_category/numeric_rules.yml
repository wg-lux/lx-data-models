schema_version: 1
knowledge_base:
  knowledge_base_module: polyp_size_category
  knowledge_base_version: 2.0.0
classification: polyp_size_category
input_descriptor: length_mm_descriptor
unit: millimeter
resolution: whole_number
source: ESGE colorectal polypectomy guideline, Ferlitsch et al. 2024, doi:10.1055/a-2304-3219,
  recommendations 1, 3, 4, 5. Size categories only; treatment also depends on lesion
  context.
rules:
- choice: size_le_5
  lower: 0.0
  upper: 5.0
  lower_inclusive: false
  upper_inclusive: true
- choice: size_6_9
  lower: 5.0
  upper: 10.0
  lower_inclusive: false
  upper_inclusive: false
- choice: size_10_19
  lower: 10.0
  upper: 20.0
  lower_inclusive: true
  upper_inclusive: false
- choice: size_ge_20
  lower: 20.0
  upper: null
  lower_inclusive: true
  upper_inclusive: false
