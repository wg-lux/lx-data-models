    - name: endoscopy_cold_snare_polypectomy_colorectal
      record_type: finding_intervention
      description: Cold snare polypectomy is a purely mechanical snare-based colorectal
        resection technique without electrocautery. It is primarily used for diminutive
        and small colorectal polyps and is associated with a very low risk of delayed
        thermal injury.
      intervention_types:
