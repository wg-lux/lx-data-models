- model: report_finding
  name: coloreg_colonoscopy_polyp
  name_de: ColoReg-Kolonpolyp
  name_en: ColoReg colon polyp
  description: Optional repeatable colon polyps with maximum diameter, Paris and NICE; linked resection
    records hold study outcomes.
  finding: colon_polyp
  required: false
  multiple_allowed: true
  classifications:
  - classification: colon_lesion_paris
    required: true
    concept_id: coloreg.polyp.paris
    applicability_status: conditional
    applicability_rule: Required for every documented colon polyp.
  - classification: colon_lesion_nice
    required: true
    concept_id: coloreg.polyp.nice
    applicability_status: conditional
    applicability_rule: Required for every documented colon polyp.
  - classification: lesion_size_mm
    required: true
    concept_id: coloreg.polyp.size
    applicability_status: conditional
    applicability_rule: Required for each documented index polyp; record the maximum pre-resection diameter
      in millimetres.
