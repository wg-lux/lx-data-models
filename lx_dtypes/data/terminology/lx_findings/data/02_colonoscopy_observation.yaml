# Sources for guideline-derived additions in this file:
# - DGVS S2k quality guideline v2.1 (AWMF 021-022), lesion and intervention documentation: https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf
- model: finding
  name: "colon_polyp"
  name_de: "Kolonpolyp"
  name_en: "Colon Polyp"
  description: "Kolonpolyp mit Lokalisation, Größe, Morphologie, Resektions-, Bergungs- und Histologiestatus."
  finding_types:
    - observation
  interventions:
    - endoscopy_biopsy_grasper_generic
    - endoscopy_cold_snare_resection_generic
    - endoscopy_cold_snare_polypectomy_colorectal
    - endoscopy_diathermic_snare_resection_generic
    - endoscopy_hot_snare_polypectomy_colorectal
    - endoscopy_biopsy_foreceps_resection_generic
    - endoscopy_emr_generic
    - endoscopy_cold_emr_colorectal
    - endoscopy_hot_emr_colorectal
    - endoscopy_esd_generic
    - endoscopy_esd_colorectal
    - endoscopy_eftr_generic
    - endoscopy_eftr_colorectal
    - endoscopy_injection_liftup
    - endoscopy_margin_ablation_soft_coagulation_colorectal
    - endoscopy_hot_avulsion_colorectal
    - endoscopy_hemoclip_generic
    - endoscopy_over_the_scope_clip_generic
  classifications:
    # Shared Models
    ## size classifications
    - lesion_size_mm
    ## Morphology classifications
    - lesion_circularity_default
    - lesion_planarity_default
    - lesion_surface_intact_default
    ## Location
    - colonoscopy_location_default
    - colonoscopy_location_coarse
    ## histology
    - histology_dysplasia_default
    - histology_dignity_default
    - histology_in_sano_default

    # More specific Models
    ## size classifications
    - colon_lesion_size_categorical
    ## Morphology classifications
    - colon_lesion_paris
    - colon_lesion_nice
    - colon_lesion_jnet
    - colon_lesion_kudo
    - colon_lesion_lst
    - colonoscopy_specimen_retrieval_status
    - colonoscopy_histology_submission_status
    - colonoscopy_resection_technique_status
    ## histology
    - colonoscopy_polyp_histology

