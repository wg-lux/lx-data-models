# Hemorrhoids classification
# Sources for guideline-derived additions in this file:
# - DGVS S2k quality guideline v2.1 (AWMF 021-022): https://www.dgvs.de/wp-content/uploads/2023/04/S2k-LL-Qualitaetsanforderungen-Endoskopie-v2.1_Langfassung_12.01.26.pdf
- model: classification_choice

  name: "hemorrhoids_grade_0_no_hemorrhoids"
  name_de: "Keine Hämorrhoiden"
  # name_en: "No hemorrhoids"

- model: classification_choice

  name: "hemorrhoids_grade_1"
  name_de: "Grad 1"
  # name_en: "Grade 1"
  description: "Mucosal hemorrhoids that do not prolapse"

- model: classification_choice

  name: "hemorrhoids_grade_2"
  name_de: "Grad 2"
  # name_en: "Grade 2"
  description: "Hemorrhoids that prolapse during straining but reduce spontaneously"

- model: classification_choice

  name: "hemorrhoids_grade_3"
  name_de: "Grad 3"
  # name_en: "Grade 3"
  description: "Hemorrhoids that prolapse during straining and require manual reduction"

- model: classification_choice

  name: "hemorrhoids_grade_4"
  name_de: "Grad 4"
  # name_en: "Grade 4"
  description: "Irreducible prolapsed hemorrhoids"
