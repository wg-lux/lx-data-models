# Required template anchors. They make completeness explicit without changing
# or pretending that MST 3.0 itself mandates local clinical workflow rules.
- {
    model: finding,
    name: mst_egd_documentation_status,
    name_de: Vollständigkeit der ÖGD-Dokumentation,
    name_en: EGD documentation completeness,
    finding_types: [mst_luminal_finding],
    classifications: [mst_attr_completeness],
    description: "LX reporting anchor for MST 3.0 sections 2–7.",
  }
- {
    model: finding,
    name: mst_colonoscopy_documentation_status,
    name_de: Vollständigkeit der Koloskopie-Dokumentation,
    name_en: Colonoscopy documentation completeness,
    finding_types: [mst_luminal_finding],
    classifications: [mst_attr_completeness],
    description: "LX reporting anchor for MST 3.0 sections 2–7.",
  }
- {
    model: finding,
    name: mst_enteroscopy_documentation_status,
    name_de: Vollständigkeit der Enteroskopie-Dokumentation,
