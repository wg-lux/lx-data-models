    classifications: [mst_attr_completeness],
    description: "LX reporting anchor for MST 3.0 sections 2–7.",
  }
- {
    model: finding,
    name: mst_ercp_documentation_status,
    name_de: Vollständigkeit der ERCP-Dokumentation,
    name_en: ERCP documentation completeness,
    finding_types: [mst_ercp_finding],
    classifications: [mst_attr_completeness],
    description: "LX reporting anchor for MST 3.0 sections 2–7.",
  }
- {
    model: finding,
    name: mst_eus_documentation_status,
    name_de: Vollständigkeit der EUS-Dokumentation,
    name_en: EUS documentation completeness,
    finding_types: [mst_eus_finding],
    classifications: [mst_attr_completeness],
    description: "LX reporting anchor for MST 3.0 sections 2–7.",
  }
- {
    model: finding,
    name: mst_luminal_procedure_summary,
    name_de: Zusammenfassung der luminalen Maßnahmen,
    name_en: Luminal procedure summary,
    finding_types: [mst_luminal_finding],
    classifications: [mst_attr_type, mst_attr_result],
    interventions:
      [
        mst_proc_luminal_sampling,
        mst_proc_luminal_balloon_dilation,
        mst_proc_luminal_bougie_dilation,
        mst_proc_luminal_band_ligation,
        mst_proc_luminal_injection_therapy,
        mst_proc_luminal_clipping,
        mst_proc_luminal_cautery,
        mst_proc_luminal_apc,
        mst_proc_luminal_polypectomy,
        mst_proc_luminal_hot_biopsy,
        mst_proc_luminal_foreign_body_removal,
        mst_proc_luminal_emr,
        mst_proc_luminal_esd,
        mst_proc_luminal_stent_placement,
        mst_proc_luminal_peg_placement,
        mst_proc_luminal_tube_placement,
        mst_proc_luminal_transmural_drainage,
        mst_proc_luminal_ablation_therapy,
      ],
    description: "MST 3.0 luminal procedure documentation.",
  }
- {
    model: finding,
    name: mst_ercp_procedure_summary,
    name_de: Zusammenfassung der ERCP-Maßnahmen,
    name_en: ERCP procedure summary,
    finding_types: [mst_ercp_finding],
    classifications: [mst_attr_type, mst_attr_result],
    interventions:
      [
        mst_proc_ercp_cannulation,
        mst_proc_ercp_opacification,
        mst_proc_ercp_papillotomy,
        mst_proc_ercp_balloon_dilatation,
        mst_proc_ercp_bougie_dilatation,
        mst_proc_ercp_stone_extraction,
        mst_proc_ercp_stent_placement,
        mst_proc_ercp_stent_removal,
        mst_proc_ercp_hemostasis,
      ],
    description: "MST 3.0 ERCP procedure documentation.",
  }
- {
    model: finding,
    name: mst_eus_procedure_summary,
    name_de: Zusammenfassung der EUS-Maßnahmen,
    name_en: EUS procedure summary,
