  name_de: Perforation des Hohlorgans
  finding_types: [mst_adverse_event]
  classifications: [mst_event_severity, mst_event_outcome, mst_event_intraprocedure_perforation_location, mst_event_intraprocedure_perforation_communicating_to,
    mst_event_intraprocedure_perforation_type]
  description: '§7.1. Location; communicating to Retroperitoneum/Peritoneum/Mediastinum; type: By endoscope/Sphincterotomy-related/Polypectomy-related/Dilation-related.'
