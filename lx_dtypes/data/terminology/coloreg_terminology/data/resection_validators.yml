- model: findings_validator
  name: coloreg_hot_snare_requires_settings
  name_de: "ColoReg – Heißschlingenresektion erfordert Elektrochirurgie-Einstellungen"
  finding: coloreg_polyp_resection
  operator: condition
  query:
    finding: coloreg_polyp_resection
    operator: condition
    condition:
      any:
      - classification: coloreg_snare_type
        comparator: in
        values:
        - coloreg_snare_diathermic
        - coloreg_snare_both
      then_requires:
      - kind: classification
        name: coloreg_electrosurgery_settings
- model: findings_validator
  name: coloreg_primary_success_requires_protocol
  name_de: "ColoReg – Primärer Erfolg erfordert Protokollangabe"
  finding: coloreg_polyp_resection
  operator: condition
  query:
    finding: coloreg_polyp_resection
    operator: condition
    condition:
      any:
      - classification: coloreg_primary_success
        comparator: in
        values:
        - 'yes'
        - 'no'
      then_requires:
      - kind: classification
        name: coloreg_primary_success_protocol
