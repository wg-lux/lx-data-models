# ColoReg study-authored capture terminology. No treatment recommendations or default outcomes.
- model: classification_choice_descriptor
  name: coloreg_case_id_value
  name_de: Pseudonyme Fallkennung
  name_en: Pseudonymous case identifier
  description: Stable pseudonymous study case key. No patient name or date of birth; hosts resolve authorized
    patient linkage.
  classification_choice_descriptor_type: text
  text_max_length: 255
  default_value_str: ''
- model: classification_choice
  name: coloreg_case_id_documented
  name_de: Pseudonyme Fallkennung
