- model: classification
  name: "colonoscopy_location_default"
  name_de: "Koloskopie Standard"
  name_en: "Colonoscopy Default"
  classification_types: ["location"]
  classification_choices:
    [
      "terminal_ileum",
      "cecum",
      "ileocolonic_anastomosis",
      "ascending_colon",
      "right_flexure",
      "transverse_colon",
      "left_flexure",
      "descending_colon",
      "sigmoid_colon",
      "rectum",
      "anal_canal",
      "unknown",
    ]

