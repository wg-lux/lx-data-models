- model: classification
  name: "endoscopy_medication_documentation_status"
  name_de: "Dokumentationsstatus der Endoskopie-Medikation"
  name_en: "Endoscopy medication documentation status"
  description: "Explizite Angabe, ob während der Untersuchung Medikamente verabreicht wurden."
  classification_types: []
  classification_choices:
    - documented_none
    - documented_present
    - documented_unknown

- model: classification
  name: "endoscopy_medication_product_and_dose"
  name_de: "Medikament und verabreichte Dosis"
  name_en: "Medication product and administered dose"
  description: "Das verabreichte Medikament einschließlich der tatsächlich verabreichten numerischen Dosis."
  classification_types: []
  classification_choices:
    - medication_propofol
    - medication_midazolam
    - medication_fentanyl
    - medication_pethidine
    - medication_butylscopolamine

- model: classification
  name: "medication_administration_route"
  name_de: "Applikationsart"
  name_en: "Route of administration"
  description: "Applikationsart der Medikamentenverabreichung."
  classification_types: []
  classification_choices:
    - medication_route_intravenous
    - medication_route_oral
    - medication_route_rectal
    - medication_route_other

- model: classification
  name: "medication_administration_method"
  name_de: "Verabreichungsform"
  name_en: "Administration method"
  description: "Form der Medikamentenverabreichung."
  classification_types: []
  classification_choices:
    - medication_method_bolus
    - medication_method_infusion
    - medication_method_other
