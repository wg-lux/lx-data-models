- {model: classification_choice, name: mst30_value_volume_ml, name_de: Volumenangabe, name_en: Volume value, classification_choice_descriptors: [mst30_volume_ml_value]}
- {model: classification_choice, name: mst30_value_free_text, name_de: Freitext, name_en: Free text, classification_choice_descriptors: [mst30_free_text_value]}
- {model: classification_choice, name: mst30_value_yes, name_de: Ja, name_en: "Yes"}
