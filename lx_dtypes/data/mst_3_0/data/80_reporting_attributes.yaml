# Typed reporting controls derived from the attribute columns in MST 3.0.
# The mst30_ prefix documents these reusable lx-dtypes structures as a
# traceable implementation layer; the underlying MST field content is unchanged.

- {model: classification_type, name: mst30_attribute, name_de: MST-Attribut, name_en: MST attribute}
- {model: unit, name: mst30_millimeter, abbreviation: mm, name_de: Millimeter, name_en: Millimeter}
- {model: unit, name: mst30_centimeter, abbreviation: cm, name_de: Zentimeter, name_en: Centimeter}
- {model: unit, name: mst30_milliliter, abbreviation: ml, name_de: Milliliter, name_en: Milliliter}
- {model: unit, name: mst30_french, abbreviation: Fr, name_de: French, name_en: French}
- {model: unit, name: mst30_count, abbreviation: count, name_de: Anzahl, name_en: Count}

- model: classification_choice_descriptor
  name: mst30_size_mm_value
  name_de: Größe in Millimetern
  name_en: Size in millimeters
  classification_choice_descriptor_type: numeric
  unit: mst30_millimeter
  numeric_min: 0
  numeric_max: 1000
- model: classification_choice_descriptor
  name: mst30_length_cm_value
  name_de: Länge in Zentimetern
  name_en: Length in centimeters
  classification_choice_descriptor_type: numeric
  unit: mst30_centimeter
  numeric_min: 0
  numeric_max: 1000
- model: classification_choice_descriptor
  name: mst30_count_value
  name_de: Anzahl
  name_en: Count
  classification_choice_descriptor_type: numeric
  unit: mst30_count
  numeric_min: 0
  numeric_max: 1000
- model: classification_choice_descriptor
  name: mst30_volume_ml_value
  name_de: Volumen in Millilitern
  name_en: Volume in milliliters
  classification_choice_descriptor_type: numeric
  unit: mst30_milliliter
  numeric_min: 0
  numeric_max: 10000
- model: classification_choice_descriptor
  name: mst30_free_text_value
  name_de: Freitextangabe
  name_en: Free-text value
  classification_choice_descriptor_type: text
  text_max_length: 1000

- {model: classification_choice, name: mst30_value_size_mm, name_de: Größenangabe, name_en: Size value, classification_choice_descriptors: [mst30_size_mm_value]}
- {model: classification_choice, name: mst30_value_length_cm, name_de: Längenangabe, name_en: Length value, classification_choice_descriptors: [mst30_length_cm_value]}
