# Published templates (absence of a lifecycle override means published package content).
- &mst30_egd_template
  model: report_template
  name: mst30_egd_report
  name_de: MST 3.0 – ÖGD-Bericht
  name_en: MST 3.0 – EGD report
  description: Strukturierte ÖGD-Dokumentation nach WEO MST 3.0.
  version: "3.0"
  examination: star_upper_gi_endoscopy
  report_sections: [mst30_egd_overview, mst30_egd_mucosa_and_lesions, mst30_egd_diagnoses, mst30_egd_procedures_events]
  validators:
    examination_validators: [mst30_egd_minimum_documentation]
    findings_validators: [mst30_egd_documentation_status_documented]
  coverage_version: report_concept_coverage_v1
  coverage_concepts:
    - &mst30_egd_coverage
      concept_id: mst30.egd.documentation_status
      label: Vollständigkeit der MST-ÖGD-Dokumentation
      applicability_status: required
      validator_names: [mst30_egd_documentation_status_documented]
      evidence_path: [patient_findings]
      finding_selector: {finding_name: mst30_egd_documentation_status, classification_name: mst30_attr_completeness}
      allowed_values: [mst30_value_complete, mst30_value_incomplete, mst30_value_not_applicable]
      guideline_citations: ["WEO MST 3.0 sections 2–7"]
- model: report_template
  name: mst30_gastroscopy_report
  name_de: MST 3.0 – Gastroskopiebericht
  name_en: MST 3.0 – Gastroscopy report
  description: Strukturierte Gastroskopiedokumentation nach WEO MST 3.0.
