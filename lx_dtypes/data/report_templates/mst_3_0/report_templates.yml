    - { finding: mst_event_intraprocedure_bleeding }
    - { finding: mst_event_intraprocedure_cardiopulmonary }
    - { finding: mst_event_postprocedure_abdominal_pain }
    - { finding: mst_event_postprocedure_infection }
    - { finding: mst_event_postprocedure_late_perforation }
    - { finding: mst_event_postprocedure_late_bleeding }

