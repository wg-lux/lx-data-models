# Upper endoscopy sections
- model: report_template_section
  name: mst_egd_overview
  name_de: "ÖGD – Übersicht"
  title_de: Untersuchungsübersicht
  title_en: Examination overview
  position: 0
  types: [baseline]
  findings:
    - {
        finding: mst_egd_documentation_status,
        required: true,
        multiple_allowed: false,
        concept_id: mst30.egd.documentation_status,
        classifications:
          [
            {
              classification: mst_attr_completeness,
              required: true,
              concept_id: mst30.egd.documentation_status.value,
            },
          ],
      }
    - {
        finding: mst_luminal_normal,
        required: false,
        multiple_allowed: false,
        classifications: [],
      }
    - {
        finding: mst_luminal_stenosis,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_appearance, required: false },
            { classification: mst_attr_length_cm, required: false },
          ],
      }
    - {
        finding: mst_luminal_diverticulum,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_number_category, required: false },
            { classification: mst_attr_size_mm, required: false },
            { classification: mst_attr_type, required: false },
          ],
      }
    - {
        finding: mst_luminal_hiatal_hernia,
        required: false,
        multiple_allowed: false,
        classifications: [],
      }
    - {
        finding: mst_luminal_z_line,
        required: false,
        multiple_allowed: false,
        classifications: [],
      }
- model: report_template_section
  name: mst_egd_mucosa_and_lesions
  name_de: "ÖGD – Schleimhaut und Läsionen"
  title_de: Mukosa und Läsionen
  title_en: Mucosa and lesions
  position: 10
  findings:
    - {
        finding: mst_mucosa_erythematous,
        required: false,
        multiple_allowed: true,
        classifications:
          [{ classification: mst_attr_distribution, required: false }],
      }
    - {
        finding: mst_mucosa_edematous,
        required: false,
        multiple_allowed: true,
        classifications:
          [{ classification: mst_attr_distribution, required: false }],
      }
    - {
        finding: mst_mucosa_hemorrhagic,
        required: false,
        multiple_allowed: true,
        classifications:
          [{ classification: mst_attr_distribution, required: false }],
      }
    - {
        finding: mst_mucosa_atrophic,
        required: false,
        multiple_allowed: true,
        classifications:
          [{ classification: mst_attr_distribution, required: false }],
      }
    - {
        finding: mst_mucosa_barretts_esophagus,
        required: false,
        multiple_allowed: false,
        classifications: [{ classification: mst_prague_cm, required: false }],
      }
    - {
        finding: mst_mucosa_esophagitis,
        required: false,
        multiple_allowed: false,
        classifications:
          [
            { classification: mst_los_angeles, required: false },
            { classification: mst_attr_bleeding, required: false },
          ],
      }
    - {
        finding: mst_flat_angioectasia,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_number_category, required: false },
            { classification: mst_attr_bleeding, required: false },
          ],
      }
    - {
        finding: mst_flat_dieulafoy_lesion,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_number_category, required: false },
            { classification: mst_attr_bleeding, required: false },
          ],
      }
    - {
        finding: mst_protruding_polyp,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_size_mm, required: false },
            { classification: mst_attr_appearance, required: false },
            { classification: mst_paris, required: false },
          ],
      }
    - {
        finding: mst_protruding_tumor_mass,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_size_mm, required: false },
            { classification: mst_attr_appearance, required: false },
            { classification: mst_paris, required: false },
          ],
      }
    - {
        finding: mst_protruding_varices,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_esophageal_varices_size, required: false },
            { classification: mst_attr_bleeding, required: false },
          ],
      }
    - {
        finding: mst_excavated_erosion,
        required: false,
        multiple_allowed: true,
        classifications:
          [{ classification: mst_attr_bleeding, required: false }],
      }
    - {
        finding: mst_excavated_ulcer,
        required: false,
        multiple_allowed: true,
        classifications:
          [
            { classification: mst_attr_size_mm, required: false },
            { classification: mst_forrest, required: false },
          ],
      }
- model: report_template_section
  name: mst_egd_diagnoses
  name_de: "ÖGD – Diagnosen"
  title_de: Endoskopische Diagnosen
  title_en: Endoscopic diagnoses
  position: 20
  findings:
    [
      mst_dx_upper_achalasia,
      mst_dx_upper_barretts_esophagus,
      mst_dx_upper_benign_stricture,
      mst_dx_upper_coeliac_disease,
      mst_dx_upper_duodenal_ulcer,
      mst_dx_upper_esophageal_cancer,
      mst_dx_upper_esophageal_varices,
      mst_dx_upper_gastric_cancer,
      mst_dx_upper_gastric_ulcer,
      mst_dx_upper_gastric_varices,
      mst_dx_upper_reflux_esophagitis,
    ]
- model: report_template_section
  name: mst_egd_procedures_events
  name_de: "ÖGD – Eingriffe und Ereignisse"
  title_de: Maßnahmen und unerwünschte Ereignisse
  title_en: Procedures and adverse events
  position: 30
  findings:
    - {
        finding: mst_luminal_procedure_summary,
        required: false,
        multiple_allowed: true,
        classifications:
