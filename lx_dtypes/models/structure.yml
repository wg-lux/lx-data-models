version: 1
tier: domain
path: lx_dtypes/models
parent: ../structure.yml
summary: Typed domain, knowledge-base, ledger, interface, and external exchange contracts. Backend-specific
  representations share explicit contract boundaries.
responsibilities:
- Define strict Pydantic contracts and typed dictionary representations
- Own versioned report extraction evidence and staging receipts; lifecycle transitions belong to the host native core.
- Maintain knowledge-base/report-template graphs and ledger identities
- Own hub transfer version 7 with hub-scoped UUIDv8 pseudonyms and exact segment timeline coordinates
boundaries:
- All package-owned Pydantic models use the shared model policies; explicit projection and extension exceptions are inventoried.
- Runtime evaluation depends on contracts; retained reverse dependencies require an exact reviewed exception.
- Keep application service orchestration outside shared models
- Preserve raw video identity across processing and transfer
entrypoints:
- name: Knowledge-base reporting adapter
  file: interface/KnowledgeBaseReporting.py
  purpose: Compile reports, project ledger findings and evaluate runtime rules through the stable KB API
- name: Knowledge-base admissibility adapter
  file: interface/KnowledgeBaseAdmissibility.py
  purpose: Check ledger observations against terminology and report requirements
- name: Knowledge-base exchange adapter
  file: interface/KnowledgeBaseInterop.py
  purpose: Project core concepts and import or export FHIR terminology and observations
- name: Validator query normalization
  file: knowledge_base/validators/QueryNormalization.py
  purpose: Shared query defaults, alignment and condition invariants without mutating caller inputs
- name: Shared model policies
  file: model.py
  purpose: Closed, strict, frozen and root-value profiles shared by every model family
- name: Pydantic ledger registry
  file: ledger/pydantic_main.py
  purpose: Canonical ledger definitions without loading ORM adapters; main.py reuses the same registry
- name: Combined Pydantic registry
  file: pydantic_main.py
  purpose: Combined model names and type unions without loading backend aggregation
- name: Reporting vocabulary
  file: contracts/reporting_types.py
  purpose: Shared report verbosity tokens without a reverse dependency on KB representations
- name: Electrosurgical activation CSV
  file: contracts/electrosurgical_activations.py
  purpose: Strict, lossless reader for per-activation HF generator summary CSV exports with explicit source
    timezone
- name: Electrical curve profiles
  file: knowledge_base/electrical_curve_profile.py
  purpose: Versioned HF application curve quantities, phase bins, limits and multivariate regression specification
- name: Pinned KB definition identity
  file: ledger/kb_reference.py
  purpose: The single rule binding a ledger observation to its exact KB definition name, module and version
- name: Ledger electrical applications
  file: ledger/p_electrical_application/Pydantic.py
  purpose: Phase-binned HF application curves and regression comparisons with strictly earlier references,
    pinned to exact KB profile identities
- name: Electrical curve contracts
  file: contracts/electrical_curve.py
  purpose: Application curve, section status and self-consistent regression result contracts
- name: Knowledge-base time references
  file: knowledge_base/time_reference.py
  purpose: Named clock relationships and labeled reference, training, validation and test examples
- name: Ledger time observations
  file: ledger/p_time_offset/Pydantic.py
  purpose: Examination-specific offsets linked to exact KB definitions and video PTS evidence
- name: Time evidence validation
  file: contracts/time_reference.py
  purpose: Bind clock anchors to existing generation or verified recording timeline coordinates
- name: Clock timestamps and offsets
  file: contracts/time.py
  purpose: Exact PTS and electrosurgery ticks, UTC examination timestamps and signed clock anchors
- name: Table import vocabulary
  file: interface/table_import.py
  purpose: Load validated header and value suggestions for explicit table mappings
- name: Reporting concept diagnostics
  file: interface/KnowledgeBase.py
  purpose: One runtime warning per affected module retains all source-located definitions for package linting.
- name: Report text embeddings
  file: contracts/text_embedding.py
  purpose: Versioned finite text vectors and explicit annotated report-span references
- name: Study exchange
  file: contracts/study_exchange.py
  purpose: Canonical portable study definitions, collections, evaluations and package closure for hub and Excel
- name: Study analysis definitions
  file: contracts/study_analysis.py
  purpose: Shared declarative predicates, analysis provenance, numeric and categorical inference configuration, diagnostic accuracy, statistical results and YAML plot label contracts
- name: Study annotation label presentation
  file: contracts/study_label_presentation.py
  purpose: Ordered display names, colors, expertise scopes and explicit study label whitelist configuration
- name: Study report text extraction
  file: contracts/study_text_extraction.py
  purpose: Cohort-scoped anonymized report evidence, review suggestions and explicit approval requests
- name: Complete package snapshot
  file: contracts/package_snapshot.py
  purpose: Preserve every registered knowledge-base concept in a typed package snapshot
- name: Study collection
  file: contracts/study_collection.py
  purpose: Bind canonical ledger observations to versioned assessment and study provenance
- name: Video segment timeline coordinates
  file: contracts/video_segment_timeline.py
  purpose: Exact segment presentation timestamps on the processed generation and, with verified ancestry, the
    original recording
- name: Electrosurgical measurements
  file: contracts/electrosurgical_measurements.py
  purpose: HF generator channels with canonical UCUM units bound to source hash, parser version and clock epoch
- name: Electrical video alignment
  file: contracts/electrical_video_alignment.py
  purpose: Exact frame-window result contracts and compatibility delegates to evaluation/electrical.py
- name: Media workflow states and transitions
  file: contracts/media_workflow.py
  purpose: Privacy, annotation and release track tokens, transition tables and deletion points for one media item
- name: Media workflow API wire shapes
  file: contracts/media_workflow_api.py
  purpose: Item response, allowed events, blocked stages and worklist stage counts of the media workflow API
- name: Media workflow policy payloads
  file: contracts/media_workflow_policy.py
  purpose: Validation acknowledgement, examination link key, shared-salt precondition and consent withdrawal outcome
- name: German FHIR identifiers
  file: contracts/german_fhir.py
  purpose: KVNR and PZN check digits and German base-profile system URIs
- name: KBV key tables
  file: contracts/kbv_key_tables.py
  purpose: Generated BMP Dosiereinheit and KBV Darreichungsform tables bound by ePA medication profiles
- name: ePA eMP projection
  file: ledger/medical/epa.py
  purpose: Fail-closed projection of patient medications onto gematik ePA eMP add and update Parameters
- name: Contracts
  file: contracts/__init__.py
  purpose: Shared interchange exports
- name: Data format syntax table
  file: interface/data_formats/base.py
  purpose: Identified JSON, YAML, TOML, XML, FHIR, delimited and XLSX formats with syntax tokens
- name: Record import and export
  file: interface/data_formats/codec.py
  purpose: Validated, bounded dump and load of single records and record lists in every registered data format
- name: Knowledge-base interface
  file: interface/__init__.py
  purpose: Version-aware loading API
- name: Report templates
  file: knowledge_base/report_template/__init__.py
  purpose: Graph and validation contracts
- name: Ledger
  file: ledger/__init__.py
  purpose: Observation model exports
dependencies:
  internal: []
  external:
  - Pydantic v2
  - Django
  - FHIR
submodules: []
contracts:
- name: Model boundary inventory
  doc: ../../docs/model-boundaries.yml
- name: Dates, times and offsets
  doc: ../../docs/guides/dates-and-times.md
- name: Model concepts
  doc: ../../docs/guides/data-model-concept-map.md
- name: Report-template infrastructure
  doc: ../../docs/guides/report-template-infrastructure.md
- name: Record import and export formats
  doc: ../../docs/guides/record-data-formats.md
- name: ePA FHIR compatibility
  doc: ../../docs/guides/epa-fhir-compatibility.md
- name: Electrosurgical video alignment
  doc: ../../docs/guides/electrosurgical-video-alignment.md
tests:
  directory: ../../tests/unit/lx_dtypes/models
  command: uv run pytest tests/unit/lx_dtypes/models/contracts -q
files:
- base
- contracts
- interface
- knowledge_base
- ledger
- meta
