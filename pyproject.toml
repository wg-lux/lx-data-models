[project]
authors = [
  {name = "Thomas J. Lux", email = "lux_t1@ukw.de"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "bibtexparser>=1.4.0",
  "django>=6.0",
  "django-ninja>=1.5.3",
  "django-stubs[compatible-mypy]>=5.2.8",
  "django-stubs-ext>=5.2.8",
  "icecream>=2.1.4",
  "numpy>=2.2.3",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pandas-stubs>=2.3.3.251201",
  "pandera[pandas,io,mypy]>=0.27.0",
  "pillow>=11.3.0",
  "pydantic>=2.10.6",
  "python-ffmpeg>=2.0.12",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "scikit-learn>=1.8.0",
  "scipy>=1.16.1",
  "types-pyyaml>=6.0.12.20250915",
]
description = "Typed clinical data models, terminology, and interoperability contracts"
keywords = [
  "clinical-data",
  "data-models",
  "fhir",
  "medical-research",
  "pydantic",
  "terminology",
]
license = {file = "LICENSE"}
maintainers = [
  {name = "Thomas J. Lux", email = "lux_t1@ukw.de"},
]
name = "lx-dtypes"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12,<3.13"
version = "0.2.26"

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "flake8>=7.3.0",
  "linkify-it-py>=2.0.3",
  "myst-parser>=4.0.1",
  "mypy>=1.16.0",
  "pip>=25.2",
  "pre-commit>=4.5.0",
  "pytest>=9.0.2",
  "pytest-cov>=6.1.1",
  "pytest-env>=1.1.5",
  "pytest-mypy-plugins>=3.2.0",
  "pytest-xdist>=3.8.0",
  "pytest-django>=4.11.1",
  "radon>=6.0.1",
  "sphinx-autodoc-typehints>=3.5.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx>=8.2.3,<9.0",
  "furo>=2025.9.25",
  "ruff>=0.14.8",
  "twine>=7.0.0",
  "opencv-python-headless>=4.12.0.88",

]

docs = [
  "linkify-it-py>=2.0.3",
  "myst-parser>=4.0.1",
  "sphinx-autodoc-typehints>=3.5.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx>=8.2.3,<9.0",
  "furo>=2025.9.25",
]

[project.scripts]
ok = "lx_dtypes.scripts.lint_kb_yaml:main"
lx-dtypes-kb-registry = "lx_dtypes.scripts.kb_registry:main"
lx-dtypes-prototype-kb-smoke = "lx_dtypes.scripts.prototype_kb_smoke:main"
lx-dtypes-release = "lx_dtypes.scripts.release:main"
lx-dtypes-verify-packaged-templates = "lx_dtypes.scripts.verify_packaged_report_templates:main"
lx-dtypes-fhir-lxdm-diagram = "lx_dtypes.scripts.fhir_lxdm_diagram:main"

[project.urls]
Changelog = "https://github.com/wg-lux/lx-data-models/blob/main/CHANGELOG.md"
Homepage = "https://github.com/wg-lux/lx-data-models"
Issues = "https://github.com/wg-lux/lx-data-models/issues"
Repository = "https://github.com/wg-lux/lx-data-models"

[tool.pyright]
include = ["lx_dtypes", "scripts", "tests"]
stubPath = "typings"
# These settings help fix the "Unknown" errors specifically
# reportMissingTypeStubs = false
# reportUnknownMemberType = false
# reportUnknownVariableType = false

exclude = [
  "**/__pycache__",
  ".devenv",
  ".direnv",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "dist",
  "docs/_build",
  "lx-terminology-editor",
  "**/migrations/**",
  "**/manage.py",
  "**/settings.py",
]
useLibraryCodeForTypes = false

[tool.mypy]
exclude = '^(typings/|\.venv/|venv/|env/)'
mypy_path = ["typings"]
plugins = ["pandera.mypy", "mypy_django_plugin.main"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "lx_dtypes.django_settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
addopts = """
    --ds=tests.django_settings
    --import-mode=importlib
    --cov-report=xml
    --cov-fail-under=70
"""
markers = [
  "localfiles: depends on files present only on dev machines",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Public modules and legacy aggregate aliases intentionally retain their stable names.
"lx_dtypes/django/smoke_settings.py" = ["F403"]
"lx_dtypes/django/migrations/*.py" = ["RUF012"]
"lx_dtypes/models/**/*.py" = ["N999"]
"lx_dtypes/models/base/app_base_model/django/KnowledgebaseBaseModelDjango.py" = ["PYI059", "UP046"]
"lx_dtypes/models/base/app_base_model/django/LedgerBaseModelDjango.py" = ["PYI059", "UP046"]
"lx_dtypes/models/base/app_base_model/pydantic/InterfaceMixIns.py" = ["PYI059", "UP046"]
"lx_dtypes/models/contracts/adapters.py" = ["PYI046"]
"lx_dtypes/models/knowledge_base/**/__init__.py" = ["PYI042", "UP007", "UP040"]
"lx_dtypes/models/knowledge_base/main.py" = ["UP007", "UP040"]
"lx_dtypes/models/knowledge_base/pydantic_main.py" = ["UP007", "UP040"]
"lx_dtypes/models/ledger/**/__init__.py" = ["PYI042", "UP007"]
"lx_dtypes/models/ledger/main.py" = ["UP007"]
"tests/django_settings.py" = ["F403"]
"tests/fixtures/lx_dtypes/models/interface/__init__.py" = ["F403"]
"tests/**/*.py" = ["N999"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.hatch.build]
exclude = [
  ".devenv",
  ".devenv/**",
  ".direnv",
  ".direnv/**",
  "result",
  "result/**",
  "tests",
  "tests/**",
]

[tool.hatch.build.targets.wheel]
packages = ["lx_dtypes"]

[tool.hatch.build.targets.wheel.force-include]
"lx_dtypes/py.typed" = "lx_dtypes/py.typed"
"lx_kb_lint.py" = "lx_kb_lint.py"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".devenv",
  ".devenv/**",
  ".direnv",
  ".direnv/**",
  "tests",
  "tests/**",
  "docs/production",
  "docs/production/**",
  "htmlcov",
  "htmlcov/**",
  "result",
  "result/**",
  "storage",
  "storage/**",
]

[tool.hatch.build.targets.sdist.force-include]
"lx_dtypes/data" = "lx_dtypes/data"
"lx_dtypes/py.typed" = "lx_dtypes/py.typed"
"lx_kb_lint.py" = "lx_kb_lint.py"

# 🟢 HATCH ENVIRONMENTS (Bonus)
# # You can define your test environment here instead of using tox
# [tool.hatch.envs.default]
# dependencies = [
#   "pytest",
#   "pytest-django",
#   "lx-dtypes[dev,docs]", # Installs your own package with the extra
# ]

# [tool.hatch.envs.default.scripts]
# test = "pytest"

[tool.uv]
# Resolve for macOS, Linux and Windows
environments = [
  "sys_platform=='darwin'",
  "sys_platform=='linux'",
  "sys_platform=='win32'",
]
