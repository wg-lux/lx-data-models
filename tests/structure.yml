version: 1
tier: domain
path: tests
parent: ../structure.yml
summary: Deterministic unit, integration, and package-boundary verification. Unit suites mirror lx_dtypes
  and fixtures remain test-only.
responsibilities:
- Verify typed contracts, loaders, adapters, and packaged resources
- Verify repository tooling and executable documentation
boundaries:
- Use temporary directories for generated artifacts
- Do not expose fixtures as public package dependencies or include patient data
entrypoints:
- name: Text embedding contract tests
  file: unit/lx_dtypes/models/contracts/test_text_embedding.py
  purpose: Verify compatible cosine spaces and report-only span request boundaries
- name: Standardized CSV export tests
  file: unit/lx_dtypes/stats/test_standardized.py
  purpose: Verify complete columns, medication plans, annotations and failed export preservation
- name: Database CSV export tests
  file: unit/lx_dtypes/django/test_standardized_export.py
  purpose: Verify queryset scope, concrete fields and many-to-many links
- name: Study exchange tests
  file: unit/lx_dtypes/models/contracts/test_study_exchange.py
  purpose: Verify canonical bundle closure, UUID linkage, typed workbook round trips and tampering rejection
- name: Study analysis tests
  file: unit/lx_dtypes/stats/test_study.py
  purpose: Verify canonical rule validation, explicit denominators and shipped ColoReg R0 evaluation
- name: Study linkage tests
  file: unit/lx_dtypes/stats/test_study_linkage.py
  purpose: Verify lesion identity, chronology, missing references and longitudinal analysis roles
- name: Study collection contract tests
  file: unit/lx_dtypes/models/contracts/test_study_collection.py
  purpose: Verify persistence provenance, strict boundaries, and observation round trips
- name: Fixtures
  file: conftest.py
  purpose: Shared fixture registration
- name: Django test settings
  file: django_settings.py
  purpose: Isolated host test configuration
- name: Context tests
  file: test_structure.py
  purpose: Schema and manifest graph drift checks
- name: Package workflow tests
  file: unit/lx_dtypes/test_packages.py
  purpose: Verify creation, portable ZIP roundtrips, archive rejection, explicit registry dependency loading, core graph checks, and ledger assessment
dependencies:
  internal:
  - ../lx_dtypes
  - ../scripts
  external:
  - pytest
  - pytest-django
submodules: []
contracts:
- name: Test layout
  doc: ../docs/guides/package_boundary.md
tests:
  directory: .
  command: uv run pytest tests/test_structure.py -q
