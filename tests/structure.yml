version: 1
tier: domain
path: tests
parent: ../structure.yml
summary: Deterministic unit, integration, and package-boundary verification. Unit suites mirror lx_dtypes
  and fixtures remain test-only.
responsibilities:
- Verify typed contracts, loaders, adapters, and packaged resources
- Verify repository tooling and executable documentation
boundaries:
- Use temporary directories for generated artifacts
- Do not expose fixtures as public package dependencies or include patient data
entrypoints:
- name: Development environment contract
  file: test_devenv_environment.py
  purpose: Guard non-mutating shell entry, explicit frozen sync and retained editor KB helpers
- name: Observation package contracts
  file: unit/lx_dtypes/models/ledger/test_observation_packages.py
  purpose: Verify lazy Django imports, registry identity and persisted observation roundtrips
- name: Validator query normalization tests
  file: unit/lx_dtypes/models/knowledge_base/validators/test_query_normalization.py
  purpose: Verify repeatable parsing, typed query preservation, input isolation and malformed query rejection
- name: Model boundary architecture tests
  file: test_model_boundaries.py
  purpose: Enforce common model inheritance, test ownership and reviewed dependency exceptions
- name: Concept map completeness
  file: test_docs_concept_map.py
  purpose: Verify that every contract module appears in the data-model concept map
- name: OpenAPI documentation completeness
  file: unit/lx_dtypes/django/api/test_openapi_documentation.py
  purpose: Require a description and an authentication statement for every HTTP operation
- name: Evaluation boundary tests
  file: unit/lx_dtypes/test_evaluation_boundary.py
  purpose: Verify identical model rules across contract, KB and ledger parsing and Django-free registry imports
- name: Isolated route resolver tests
  file: unit/lx_dtypes/django/api/isolated_routes/test_central_resolver.py
  purpose: Previously package-local route harness now runs in the normal test tree
- name: Isolated terminology verification
  file: test_terminology_verification.py
  purpose: Run framework-double checks from tests/isolated/terminology in a dedicated subprocess
- name: Time KB and ledger tests
  file: unit/lx_dtypes/models/contracts/test_time_reference.py
  purpose: Validate YAML training packages, exact video PTS references, ledger exports and pinned KB identity
- name: Reference migration tests
  file: unit/lx_dtypes/models/contracts/test_reference_migration.py
  purpose: Verify automatic field classification and reviewed migration rules.
- name: Time contract tests
  file: unit/lx_dtypes/models/contracts/test_time.py
  purpose: Verify exact mixed-clock offsets, timestamp validation and YAML persistence
- name: Table import vocabulary tests
  file: unit/lx_dtypes/models/interface/test_table_import_vocabulary.py
  purpose: Validate packaged aliases, concept targets and ambiguous header suggestions
- name: Categorical study tests
  file: unit/lx_dtypes/stats/test_study_categorical.py
  purpose: Numerical reference, sparse tables, diagnostic pairs and explicit missingness
- name: Study inference tests
  file: unit/lx_dtypes/stats/test_study_inference.py
  purpose: Numerical references, complete cases, independent patients and invalid model rejection
- name: Text embedding contract tests
  file: unit/lx_dtypes/models/contracts/test_text_embedding.py
  purpose: Verify compatible cosine spaces and report-only span request boundaries
- name: Standardized CSV export tests
  file: unit/lx_dtypes/stats/test_standardized.py
  purpose: Verify complete columns, medication plans, annotations and failed export preservation
- name: Database CSV export tests
  file: unit/lx_dtypes/django/test_standardized_export.py
  purpose: Verify queryset scope, concrete fields and many-to-many links
- name: Study exchange tests
  file: unit/lx_dtypes/models/contracts/test_study_exchange.py
  purpose: Verify canonical bundle closure, UUID linkage, typed workbook round trips and tampering rejection
- name: Study analysis tests
  file: unit/lx_dtypes/stats/test_study.py
  purpose: Verify canonical rule validation, explicit denominators and shipped ColoReg R0 evaluation
- name: Study linkage tests
  file: unit/lx_dtypes/stats/test_study_linkage.py
  purpose: Verify lesion identity, chronology, missing references and longitudinal analysis roles
- name: Medication and electrosurgery report tests
  file: unit/lx_dtypes/test_report_medication_electrosurgery.py
  purpose: Verify shared sections, required classifications, validators, plausibility limits and descriptor-free choices
- name: Electrosurgical activation CSV tests
  file: unit/lx_dtypes/models/contracts/test_electrosurgical_activations.py
  purpose: Verify export format, lossless decimals, timezone and daylight-saving handling, overlap and malformed-file
    rejection
- name: Registry consistency tests
  file: unit/lx_dtypes/models/test_registry_consistency.py
  purpose: Keep KB and ledger declarations derived from one registry; verify export order and idempotent round trips
- name: Electrical curve tests
  file: unit/lx_dtypes/stats/test_electrical_curve.py
  purpose: Verify profile loading and snapshots, activation section status, ledger round trips, KB identity
    pinning and regression verdicts with fail-loud degenerate designs
- name: Electrical video alignment tests
  file: unit/lx_dtypes/models/contracts/test_electrical_video_alignment.py
  purpose: Verify CFR and VFR windows, drift, decimation, repetition, coverage status and fail-loud invariants
- name: Study collection contract tests
  file: unit/lx_dtypes/models/contracts/test_study_collection.py
  purpose: Verify persistence provenance, strict boundaries, and observation round trips
- name: Knowledge-base integrity tripwires
  file: unit/lx_dtypes/models/interface/test_knowledge_base_integrity.py
  purpose: Resolve every shipped release through the provider registry, enforce retained bundle pins from
    fixtures/lx_dtypes/retained_release_bundles.json, refuse tampered installs with actionable guidance
- name: Terminology catalog tool tests
  file: test_kb_catalog_tool.py
  purpose: Exercise status, new-version and refresh-digest on a synthetic git repository
- name: Data format syntax tests
  file: unit/lx_dtypes/models/interface/test_data_formats.py
  purpose: Verify format identifiers, FHIR base syntax inheritance, lookups and unsupported-role failures
- name: Record import and export tests
  file: unit/lx_dtypes/models/interface/test_data_format_codec.py
  purpose: Verify every format round trip, FHIR cardinality, hostile input refusal, atomic files and the CLI
- name: Fixtures
  file: conftest.py
  purpose: Shared fixture registration
- name: Django test settings
  file: django_settings.py
  purpose: Isolated host test configuration
- name: Context tests
  file: test_structure.py
  purpose: Schema and manifest graph drift checks
- name: Package workflow tests
  file: unit/lx_dtypes/test_packages.py
  purpose: Verify creation, portable ZIP roundtrips, archive rejection, explicit registry dependency loading, core graph checks, and ledger assessment
- name: Package kind and channel tests
  file: unit/lx_dtypes/test_package_kinds.py
  purpose: Verify catalog kinds, lx-package.json export and mismatch rejection, legacy imports, listings, channel installs and the dependency audit
- name: Package channel contract tests
  file: unit/lx_dtypes/models/contracts/test_package_channel.py
  purpose: Verify package kinds, dependency rules and strict lx-package/1 and lx-package-channel/1 documents
- name: Package kind lint tests
  file: unit/lx_dtypes/utils/test_kb_package_kind_lint.py
  purpose: Verify kind, manifest, dependency, validator and German-name lint codes and lint every shipped release without errors
- name: German rule message tests
  file: unit/lx_dtypes/test_german_rule_messages.py
  purpose: Verify German runtime, structure and readiness messages use German concept names and runtime results carry display names
dependencies:
  internal:
  - ../lx_dtypes
  - ../scripts
  external:
  - pytest
  - pytest-django
submodules: []
contracts:
- name: Test layout
  doc: ../docs/guides/package_boundary.md
tests:
  directory: .
  command: uv run pytest tests/test_structure.py -q
